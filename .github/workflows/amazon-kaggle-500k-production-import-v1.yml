name: Amazon Kaggle 500K Production Import V1

on:
  push:
    branches: [main]
    paths:
      - '.amazon-kaggle-500k-production-import-trigger'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: amazon-kaggle-500k-production-import-v1
  cancel-in-progress: false

jobs:
  import-exact-asins:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Validate zero-cost authority
        run: |
          set -euo pipefail
          grep -Fx 'provider_spend_eur=0' .amazon-kaggle-500k-production-import-trigger
          grep -Fx 'paid_calls_triggered=0' .amazon-kaggle-500k-production-import-trigger
          grep -Fx 'purchase_authorized=false' .amazon-kaggle-500k-production-import-trigger
          grep -Fx 'manifest_sha256=3492ad16cfd2be451646492bd6e014a95182893f7f5867e195655b2d9db07dd2' .amazon-kaggle-500k-production-import-trigger
      - name: Download pinned 400K ASIN manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ionutrosu89-cmyk/Mega-product-radar/actions/artifacts/9787714578/zip' \
            --output /tmp/manifest-artifact.zip
          mkdir -p /tmp/manifest-artifact
          unzip -q /tmp/manifest-artifact.zip -d /tmp/manifest-artifact
          cp /tmp/manifest-artifact/amazon-kaggle-400k-new-asins.txt /tmp/amazon-kaggle-400k-new-asins.txt
          echo '3492ad16cfd2be451646492bd6e014a95182893f7f5867e195655b2d9db07dd2  /tmp/amazon-kaggle-400k-new-asins.txt' | sha256sum --check --strict
          test "$(wc -l < /tmp/amazon-kaggle-400k-new-asins.txt)" -eq 400000
      - name: Download public ODC-By source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/download/asaniczka/amazon-products-dataset-2023-1-4m-products' \
            --output /tmp/amazon-products-2023.zip
          test -s /tmp/amazon-products-2023.zip
      - name: Rebuild exact frozen payload
        run: |
          set -euo pipefail
          python3 scripts/build-amazon-kaggle-500k-import-payload-v1.py > /tmp/payload-build-receipt.json
          jq -e '.schema=="MPR_AMAZON_KAGGLE_500K_IMPORT_PAYLOAD_V1" and .rowCount==400000 and .manifestSha256=="3492ad16cfd2be451646492bd6e014a95182893f7f5867e195655b2d9db07dd2" and .verifiedSales==false and .databaseWrites==0 and .providerSpendEur==0 and .paidCallsTriggered==0 and .purchaseAuthorized==false' /tmp/amazon-kaggle-500k-payload/receipt.json >/dev/null
      - name: Import exact ASIN batches through GitHub OIDC
        env:
          EDGE_URL: https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/github-oidc-amazon-kaggle-import-v1
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC URL missing}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token missing}"
          MANIFEST='3492ad16cfd2be451646492bd6e014a95182893f7f5867e195655b2d9db07dd2'
          batch_no=0
          : > /tmp/import-receipts.jsonl
          for shard in /tmp/amazon-kaggle-500k-payload/shard-*.jsonl; do
            split -l 1000 -d -a 3 "$shard" /tmp/mpr-batch-
            for batch in /tmp/mpr-batch-*; do
              if (( batch_no % 5 == 0 )); then
                GH_OIDC="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mpr-amazon-kaggle-500k-import" | jq -er '.value')"
              fi
              jq -s --arg sha "$HEAD_SHA" --arg manifest "$MANIFEST" '{action:"importBatch",expectedSha:$sha,manifestSha256:$manifest,rows:.}' "$batch" > /tmp/request.json
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -H "Authorization: Bearer $GH_OIDC" -H 'Content-Type: application/json' \
                --data-binary @/tmp/request.json "$EDGE_URL" | tee -a /tmp/import-receipts.jsonl
              printf '\n' >> /tmp/import-receipts.jsonl
              rm -f "$batch"
              batch_no=$((batch_no+1))
            done
          done
          test "$batch_no" -eq 400
          jq -s -e 'length==400 and (map(.ok==true and .inputRows==1000 and .providerSpendEur==0 and .paidCallsTriggered==0 and .purchaseAuthorized==false)|all)' /tmp/import-receipts.jsonl >/dev/null
      - name: Verify exact production target
        env:
          EDGE_URL: https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/github-oidc-amazon-kaggle-import-v1
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC URL missing}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token missing}"
          GH_OIDC="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mpr-amazon-kaggle-500k-import" | jq -er '.value')"
          jq -n --arg sha "$HEAD_SHA" '{action:"finalize",expectedSha:$sha,manifestSha256:"3492ad16cfd2be451646492bd6e014a95182893f7f5867e195655b2d9db07dd2"}' > /tmp/finalize.json
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_OIDC" -H 'Content-Type: application/json' --data-binary @/tmp/finalize.json "$EDGE_URL" | tee /tmp/final-receipt.json
          jq -e '.ok==true and .distinctAsins==500000 and .distinctProducts==500000 and .ambiguousAsins==0 and .policy.providerSpendEur==0 and .policy.paidCallsTriggered==0 and .policy.purchaseAuthorized==false' /tmp/final-receipt.json >/dev/null
      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: amazon-kaggle-500k-production-import-${{ github.run_id }}
          path: |
            /tmp/amazon-kaggle-500k-payload/receipt.json
            /tmp/import-receipts.jsonl
            /tmp/final-receipt.json
          if-no-files-found: error
          retention-days: 30
