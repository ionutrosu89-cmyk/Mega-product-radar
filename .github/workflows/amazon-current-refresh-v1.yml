name: Amazon Current Refresh V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260907_amazon_current_refresh_targets_v1.sql'
      - 'supabase/migrations/20260907_amazon_current_refresh_targets_v2.sql'
      - 'supabase/functions/github-oidc-amazon-need-history-v1/index.ts'
      - 'scripts/amazon-current-refresh-pilot.mjs'
      - '.github/workflows/amazon-current-refresh-v1.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260907_amazon_current_refresh_targets_v1.sql'
      - 'supabase/migrations/20260907_amazon_current_refresh_targets_v2.sql'
      - 'supabase/functions/github-oidc-amazon-need-history-v1/index.ts'
      - 'scripts/amazon-current-refresh-pilot.mjs'
      - '.github/workflows/amazon-current-refresh-v1.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static current-refresh safety checks
        run: |
          node --check scripts/amazon-current-refresh-pilot.mjs
          grep -q "amazon_current_refresh_targets_v1" supabase/migrations/20260907_amazon_current_refresh_targets_v2.sql
          grep -q "20 hours" supabase/migrations/20260907_amazon_current_refresh_targets_v2.sql
          grep -q "refresh_targets" supabase/functions/github-oidc-amazon-need-history-v1/index.ts
          if grep -E "DataForSEO|Apify|purchaseAuthorized:true|paidCallsTriggered:[1-9]" scripts/amazon-current-refresh-pilot.mjs; then exit 2; fi

  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mint scoped OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN_JSON="$(curl --fail-with-body -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mpr-amazon-need-history")"
          echo "token=$(jq -r '.value' <<<"$TOKEN_JSON")" >> "$GITHUB_OUTPUT"
      - name: Fetch 25 recurring current-observation targets
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          mkdir -p artifacts
          jq -n --arg expectedSha "$GITHUB_SHA" '{action:"refresh_targets",expectedSha:$expectedSha,limit:25}' >/tmp/targets-request.json
          curl --fail-with-body -sS -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/targets-request.json \
            'https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/github-oidc-amazon-need-history-v1' | tee artifacts/amazon-current-refresh-targets.json
          jq -e '.ok == true and .schema == "MPR_AMAZON_CURRENT_REFRESH_TARGETS_V1" and (.targets|length) >= 1 and (.targets|length) <= 25' artifacts/amazon-current-refresh-targets.json >/dev/null
          jq -e 'all(.targets[]; ((.live_observation_count|tonumber) >= 1) and (.external_id|test("^B[A-Z0-9]{9}$")))' artifacts/amazon-current-refresh-targets.json >/dev/null
      - name: Re-observe current Amazon public product signals
        run: node scripts/amazon-current-refresh-pilot.mjs --input=artifacts/amazon-current-refresh-targets.json --out=artifacts/amazon-current-refresh-pilot.json
      - name: Persist repeated live observations
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          jq -n --arg expectedSha "$GITHUB_SHA" --slurpfile x artifacts/amazon-current-refresh-pilot.json '{action:"persist",expectedSha:$expectedSha,rows:$x[0].observations}' >/tmp/persist-request.json
          curl --fail-with-body -sS -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/persist-request.json \
            'https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/github-oidc-amazon-need-history-v1' | tee artifacts/amazon-current-refresh-persist-receipt.json
          jq -e '.ok == true and .schema == "MPR_AMAZON_NEED_HISTORY_PERSIST_RECEIPT_V1"' artifacts/amazon-current-refresh-persist-receipt.json >/dev/null
          jq -e '.receipt.providerSpendEur == 0 and .receipt.paidCallsTriggered == 0 and .receipt.purchaseAuthorized == false and .receipt.verifiedSales == false' artifacts/amazon-current-refresh-persist-receipt.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amazon-current-refresh-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
