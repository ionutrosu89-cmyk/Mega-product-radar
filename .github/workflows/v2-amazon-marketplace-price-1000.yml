name: V2 Amazon Marketplace Price 1K

on:
  push:
    branches: [main]
    paths:
      - '.v2-amazon-marketplace-price-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        offset: [0,100,200,300,400,500,600,700,800,900]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect live Amazon batch
        continue-on-error: true
        run: node scripts/amazon-live-refresh-batch.mjs --offset=${{ matrix.offset }} --limit=100 --out=artifacts/amazon-live-${{ matrix.offset }}.json
      - name: Require raw artifact and preserve diagnostics
        if: always()
        run: test -f artifacts/amazon-live-${{ matrix.offset }}.json
      - name: Upload raw batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-amazon-live-${{ matrix.offset }}
          path: artifacts/amazon-live-${{ matrix.offset }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: batch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-amazon-live-*
          path: artifacts/raw
      - name: Build combined marketplace ledger
        run: |
          INPUTS=$(find artifacts/raw -name 'amazon-live-*.json' -type f | sort | paste -sd, -)
          test -n "$INPUTS" || { echo 'NO_RAW_BATCHES'; exit 1; }
          node scripts/build-marketplace-price-ledger-v1.mjs --input="$INPUTS" --out=artifacts/marketplace-price-ledger-amazon-1000.json
      - name: Build scale report
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=[];
          function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);e.isDirectory()?walk(p):/amazon-live-\d+\.json$/.test(e.name)&&files.push(p)}}
          walk('artifacts/raw');
          const raw=files.map(f=>JSON.parse(fs.readFileSync(f,'utf8')));
          const ledger=JSON.parse(fs.readFileSync('artifacts/marketplace-price-ledger-amazon-1000.json','utf8'));
          const report={schemaVersion:'MPR_V2_AMAZON_MARKETPLACE_PRICE_1K_REPORT_V1',generatedAt:new Date().toISOString(),batchCount:raw.length,requested:raw.reduce((s,x)=>s+(x.requested||0),0),validObservations:raw.reduce((s,x)=>s+(x.validObservations||0),0),withPrice:raw.reduce((s,x)=>s+(x.coverage?.withPrice||0),0),withRating:raw.reduce((s,x)=>s+(x.coverage?.withRating||0),0),withReviews:raw.reduce((s,x)=>s+(x.coverage?.withReviews||0),0),blocked:raw.reduce((s,x)=>s+(x.diagnostics||[]).filter(d=>d.blocked).length,0),httpFailures:raw.reduce((s,x)=>s+(x.diagnostics||[]).filter(d=>d.statusCode&&d.statusCode>=400).length,0),ledgerListings:ledger.listingCount,ledgerSnapshots:ledger.snapshotCount,rejectedLedgerRows:ledger.rejectedCount,unresolvedCanonicalListingCount:ledger.unresolvedCanonicalListingCount,canonicalProductCount:ledger.canonicalProductCount,paidCallsTriggered:0,providerSpend:0,truthPolicy:{marketplacePriceIsRealizedSale:false,reviewOrRatingIsVerifiedSales:false,asinIsCrossMarketCanonicalIdentity:false,unknownEqualsZero:false,purchaseAuthorized:false}};
          fs.writeFileSync('artifacts/amazon-marketplace-price-1000-report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Upload combined 1K evidence
        uses: actions/upload-artifact@v4
        with:
          name: v2-amazon-marketplace-price-1000
          path: |
            artifacts/marketplace-price-ledger-amazon-1000.json
            artifacts/amazon-marketplace-price-1000-report.json
          if-no-files-found: error
          retention-days: 30
