name: Production Evidence Collector CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

concurrency:
  group: production-evidence-collector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check collector
        run: |
          node --check production-evidence-collector-v1.js
          node --check scripts/run-production-evidence-collector.mjs
      - name: Collector tests
        run: node --test test/production-evidence-collector-v1.test.mjs
      - name: Production safety gate
        run: npm run verify:production-safety
      - name: Local collector fail-closed drill
        run: npm run evidence:collect
