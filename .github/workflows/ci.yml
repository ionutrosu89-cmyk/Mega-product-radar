name: Mega Product Radar CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

concurrency:
  group: mega-product-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Verify migration chain
        run: npm run verify:migrations
      - name: Verify production safety invariants
        run: npm run verify:production-safety
      - name: Syntax check V2 engines
        run: |
          for f in app.js market-trend-ui.js free-intelligence-ui.js product-ro.js intelligence-ecosystem.js \
            commercial-decision-engine.js commercial-decision-client.js commercial-validation.js supplier-intelligence.js landed-cost.js \
            data-pipeline-core-v1.js ingestion-pipeline-v1.js operational-scale-observability-v1.js production-readiness-harness-v1.js persistence-telemetry-adapters-v1.js \
            ranking-eligibility-v1.js ranking-signal-ingestion-v1.js ranking-signal-resolution-v1.js \
            scripts/web-radar-scan.mjs scripts/discovery-v6-expand.mjs \
            scripts/market-intelligence-postprocess.mjs scripts/market-intelligence-history.mjs \
            scripts/market-trend-postprocess.mjs scripts/opportunity-ranking-v2.mjs \
            scripts/free-intelligence-suite.mjs scripts/test-buy-decision.mjs \
            scripts/commercial-hardening.mjs scripts/intelligence-ecosystem-v25.mjs scripts/provider-intelligence-v26.mjs \
            scripts/commercial-final-decision.mjs scripts/golden-product-pipeline.mjs \
            scripts/category-radar-postprocess.mjs scripts/watchlist-postprocess.mjs \
            scripts/free-readiness-audit.mjs scripts/dataforseo-keywords.mjs scripts/dataforseo-total-budget.mjs \
            scripts/production-safety-gate.mjs scripts/canonicalize-observations.mjs scripts/run-ingestion-pipeline.mjs \
            scripts/run-operational-scale-observability.mjs scripts/run-production-readiness-harness.mjs scripts/run-progressive-capacity-harness.mjs; do node --check "$f"; done
      - name: Validate local capacity fail-closed
        run: npm run capacity:progressive -- --stage=10K --out=artifacts/ci-progressive-capacity.json
      - name: Validate DataForSEO safety self-tests
        run: |
          node scripts/dataforseo-keywords.mjs --self-test
          node scripts/provider-intelligence-v26.mjs --self-test
      - name: Validate critical UI structure
        run: |
          node <<'NODE'
          const fs=require('fs');
          const checks={
            'action-center.html':['viewport-fit=cover','watchlist-live.json','Ce fac azi?','Maximum 3'],
            'product-decision.html':['viewport-fit=cover','market-intelligence-live.json','Dosar produs','Review Intelligence V2','Supplier Intelligence','Validare spre TEST','Decision Summary','Blocaj','Acțiunea cu impact maxim'],
            'test-buy.html':['viewport-fit=cover','Test Buy 20–30','testBuyDecision','Buget test','Landed confirmat','commercial-decision-client.js','5/9'],
            'category-radar.html':['viewport-fit=cover','Category Radar','category-radar-live.json','10–20','TEST-ready'],
            'intelligence-ecosystem.html':['viewport-fit=cover','Intelligence Ecosystem','Sales Estimation','Niche Intelligence','Romania Demand','Reverse Keyword','Historical Opportunity','Review Opportunity','Calibration','intelligence-ecosystem.js']
          };
          for(const [f,need] of Object.entries(checks)){const s=fs.readFileSync(f,'utf8');for(const x of need)if(!s.includes(x))throw new Error(`${f} missing ${x}`)}
          const u=require('./category-universe.json');
          if((u.categories||[]).length<20||u.minimumDisplayPerCategory!==10||u.targetPerCategory!==20)throw new Error('category universe invalid');
          NODE
      - name: Generate strict intelligence pipeline
        run: |
          node scripts/market-intelligence-postprocess.mjs
          node scripts/golden-product-pipeline.mjs --phase=prepaid
          node scripts/dataforseo-keywords.mjs
          node scripts/market-intelligence-history.mjs
          node scripts/market-trend-postprocess.mjs
          node scripts/opportunity-ranking-v2.mjs
          node scripts/free-intelligence-suite.mjs
          node scripts/commercial-hardening.mjs
          node scripts/intelligence-ecosystem-v25.mjs
          DATAFORSEO_V26_PAID_ENABLED=false node scripts/provider-intelligence-v26.mjs
          node scripts/test-buy-decision.mjs
          node scripts/commercial-final-decision.mjs
          node scripts/golden-product-pipeline.mjs --phase=final
          node scripts/category-radar-postprocess.mjs
          node scripts/watchlist-postprocess.mjs
          node scripts/free-readiness-audit.mjs
      - name: Verify V2.8 ecosystem and commercial safety
        run: |
          node <<'NODE'
          const d=require('./market-intelligence-live.json');
          if(d.intelligenceEcosystem?.version!=='2.5')throw new Error('missing V2.5 ecosystem');
          if(d.providerIntelligenceV27?.version!=='2.8')throw new Error('missing V2.8 provider layer');
          if(d.providerIntelligenceV27?.stats?.paidProviderEnabled!==false)throw new Error('paid provider unexpectedly enabled in CI');
          if(d.providerIntelligenceV27?.stats?.paidCalls!==0)throw new Error('paid provider called in CI');
          if(Number(d.providerIntelligenceV27?.stats?.accountedCostUsd||0)!==0)throw new Error('CI provider accounted cost must be zero');
          const provider=require('./provider-intelligence-live.json');
          if(provider.version!=='2.8'||!provider.stats)throw new Error('provider output invalid');
          if(provider.stats.providerStatus!=='PAID_DISABLED')throw new Error('unexpected CI provider status');
          if(provider.stats.costAnomalyCount!==0)throw new Error('unexpected CI cost anomaly');
          for(const p of d.products||[]){
            const e=p.evidenceCoverage||{};
            if((e.concreteRows||0)===0&&(e.coverageScore||0)>0)throw new Error('evidence inflated without proof '+p.name);
            if(e.evidenceReady&&((e.concreteRows||0)<2||(e.concreteDomains||0)<2))throw new Error('unsafe evidenceReady '+p.name);
            if(!p.salesEstimation||!p.romaniaDemand||!p.nicheIntelligence||!p.historicalIntelligence||!p.reverseKeywordIntelligence||!p.reviewOpportunity||!p.calibrationEngine)throw new Error('missing ecosystem module '+p.name);
            if(p.salesEstimation.status==='ESTIMATED_HIGH_CONFIDENCE'&&Number(p.salesEstimation.confidence||0)<75)throw new Error('high sales confidence below 75 '+p.name);
            const salesPolicy=String(p.salesEstimation.policy||'');
            const safeDisclaimer=/never\s+(?:labelled|labeled|presented\s+as)\s+verified competitor sales/i.test(salesPolicy);
            if(p.salesEstimation.status!=='ACTUAL_OBSERVED'&&/verified competitor sales/i.test(salesPolicy)&&!safeDisclaimer)throw new Error('estimate mislabeled as verified sales '+p.name);
            if(p.romaniaDemand.providerVerified===true&&!(Number(p.romaniaDemand.bestKeywordVolume||p.romaniaDemand.keywordVolume||0)>0))throw new Error('RO provider verified without search volume '+p.name);
            if((p.reverseKeywordIntelligence.competitorAsins||[]).length===0&&['ASIN_READY','PROVIDER_READY'].includes(p.reverseKeywordIntelligence.status))throw new Error('reverse keyword ready without ASIN '+p.name);
            if(p.reverseKeywordIntelligence.status==='PROVIDER_READY'&&!(p.reverseKeywordIntelligence.verifiedKeywordCount>0))throw new Error('provider reverse keywords without rows '+p.name);
            const t=p.testBuyDecision;
            if(!t)throw new Error('missing testBuyDecision '+p.name);
            if(Object.keys(t.gates||{}).length!==9)throw new Error('expected 9 final gates '+p.name);
            if(['TEST','BUY'].includes(t.commercialAction)&&(t.blockers||[]).length)throw new Error('commercial action with blockers '+p.name);
            if(t.commercialAction==='TEST'){
              if(t.quantity<20||t.quantity>30)throw new Error('unsafe TEST quantity '+p.name);
              if(!['ACTUAL_OBSERVED','ESTIMATED_HIGH_CONFIDENCE'].includes(p.salesEstimation.status)||Number(p.salesEstimation.confidence||0)<75)throw new Error('TEST without high-confidence sales model '+p.name);
              if(p.romaniaDemand?.readyForTestDemandGate!==true)throw new Error('TEST without Romania demand gate '+p.name);
            }
            if(t.commercialAction==='BUY'&&!t.buyGate?.completedRealTest)throw new Error('BUY without completed real test '+p.name);
          }
          const eco=require('./intelligence-ecosystem-live.json');
          if(eco.version!=='2.5'||!eco.stats||!eco.niches)throw new Error('ecosystem output invalid');
          const g=require('./golden-pipeline-live.json');
          if((g.stats?.paidEligible||0)>15||(g.stats?.validate||0)>5||(g.stats?.finalists||0)>3)throw new Error('Golden funnel quota exceeded');
          const r=require('./free-readiness-live.json');
          if(r.technicalReadiness<88)throw new Error('free readiness below target');
          NODE
      - name: Validate Organic Rising integrity
        run: |
          node scripts/organic-rising-quality-postprocess.mjs
          node scripts/qa-organic-rising.mjs
      - name: Run tests
        run: npm test
      - name: Validate build
        run: npm run build
