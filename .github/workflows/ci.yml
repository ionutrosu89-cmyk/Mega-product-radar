name: Mega Product Radar CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check frontend
        run: node --check app.js
      - name: Syntax check scanner
        run: node --check scripts/web-radar-scan.mjs
      - name: Syntax check category discovery
        run: node --check scripts/discovery-v6-expand.mjs
      - name: Syntax check Market Intelligence engine
        run: node --check scripts/market-intelligence-postprocess.mjs
      - name: Syntax check Market Intelligence history
        run: node --check scripts/market-intelligence-history.mjs
      - name: Syntax check Trend Intelligence
        run: node --check scripts/market-trend-postprocess.mjs
      - name: Syntax check Opportunity Ranking V2
        run: node --check scripts/opportunity-ranking-v2.mjs
      - name: Syntax check Full Free Intelligence Suite
        run: node --check scripts/free-intelligence-suite.mjs
      - name: Syntax check Test Buy decision
        run: node --check scripts/test-buy-decision.mjs
      - name: Syntax check Commercial Hardening
        run: node --check scripts/commercial-hardening.mjs
      - name: Syntax check Commercial Final Decision
        run: node --check scripts/commercial-final-decision.mjs
      - name: Syntax check Golden Product Pipeline
        run: node --check scripts/golden-product-pipeline.mjs
      - name: Syntax check Category Radar
        run: node --check scripts/category-radar-postprocess.mjs
      - name: Syntax check Smart Watchlist
        run: node --check scripts/watchlist-postprocess.mjs
      - name: Syntax check Free Readiness audit
        run: node --check scripts/free-readiness-audit.mjs
      - name: Syntax check intelligence UIs
        run: |
          node --check market-trend-ui.js
          node --check free-intelligence-ui.js
          node --check product-ro.js
      - name: Validate Action Center structure
        run: node -e "const fs=require('fs');const s=fs.readFileSync('action-center.html','utf8');for(const x of ['viewport-fit=cover','watchlist-live.json','Ce fac azi?','Maximum 3'])if(!s.includes(x))throw new Error('Action Center missing '+x)"
      - name: Validate Product Decision structure
        run: node -e "const fs=require('fs');const s=fs.readFileSync('product-decision.html','utf8');for(const x of ['viewport-fit=cover','market-intelligence-live.json','Dosar produs','Review Intelligence V2','Supplier Intelligence','Validare spre TEST','Decision Summary','Blocaj #1','Acțiunea cu impact maxim'])if(!s.includes(x))throw new Error('Product Decision missing '+x)"
      - name: Validate Test Buy dashboard structure
        run: node -e "const fs=require('fs');const s=fs.readFileSync('test-buy.html','utf8');for(const x of ['viewport-fit=cover','Test Buy 20–30','testBuyDecision','Buget test','Landed/unit'])if(!s.includes(x))throw new Error('Test Buy dashboard missing '+x)"
      - name: Validate Category Radar structure
        run: node -e "const fs=require('fs');const s=fs.readFileSync('category-radar.html','utf8');for(const x of ['viewport-fit=cover','Category Radar','category-radar-live.json','10–20','TEST-ready'])if(!s.includes(x))throw new Error('Category Radar missing '+x);const u=require('./category-universe.json');if((u.categories||[]).length<20)throw new Error('category universe too small');if(u.minimumDisplayPerCategory!==10||u.targetPerCategory!==20)throw new Error('category targets invalid')"
      - name: Syntax check DataForSEO adapter
        run: node --check scripts/dataforseo-keywords.mjs
      - name: Generate Market Intelligence fixture
        run: node scripts/market-intelligence-postprocess.mjs
      - name: Verify proof-weighted evidence coverage
        run: node -e "const d=require('./market-intelligence-live.json');for(const p of d.products||[]){const e=p.evidenceCoverage||{};if((e.concreteRows||0)===0&&(e.coverageScore||0)>0)throw new Error('evidence inflated without proof '+p.name);if(e.evidenceReady&&((e.concreteRows||0)<2||(e.concreteDomains||0)<2))throw new Error('unsafe evidenceReady '+p.name)}"
      - name: Generate Golden Pipeline prepaid fixture
        run: node scripts/golden-product-pipeline.mjs --phase=prepaid
      - name: Verify DataForSEO zero-cost fallback
        run: node scripts/dataforseo-keywords.mjs
      - name: Generate Market Intelligence history fixture
        run: node scripts/market-intelligence-history.mjs
      - name: Generate Trend Intelligence fixture
        run: node scripts/market-trend-postprocess.mjs
      - name: Generate Opportunity Ranking V2 fixture
        run: node scripts/opportunity-ranking-v2.mjs
      - name: Generate Full Free Intelligence Suite fixture
        run: node scripts/free-intelligence-suite.mjs
      - name: Generate base Test Buy fixture
        run: node scripts/test-buy-decision.mjs
      - name: Generate Commercial Hardening fixture
        run: node scripts/commercial-hardening.mjs
      - name: Apply Commercial Final Decision fixture
        run: node scripts/commercial-final-decision.mjs
      - name: Generate Golden Pipeline final fixture
        run: node scripts/golden-product-pipeline.mjs --phase=final
      - name: Verify commercial safety gates
        run: |
          node -e "const d=require('./market-intelligence-live.json');for(const p of d.products||[]){const t=p.testBuyDecision;if(!t)throw new Error('missing testBuyDecision');const n=Object.keys(t.gates||{}).length;if(n!==9)throw new Error('expected 9 final gates '+p.name);if(['TEST','BUY'].includes(t.commercialAction)&&t.blockers.length)throw new Error('commercial action with blockers '+p.name);if(t.commercialAction==='TEST'&&(t.quantity<20||t.quantity>30))throw new Error('unsafe TEST quantity '+p.name);if(t.commercialAction==='BUY'&&!t.buyGate?.completedRealTest)throw new Error('BUY without completed real test '+p.name)}"
      - name: Verify Golden Pipeline quotas and semantics
        run: node -e "const d=require('./golden-pipeline-live.json');if((d.stats?.paidEligible||0)>15)throw new Error('paid funnel exceeds 15');if((d.stats?.validate||0)>5)throw new Error('validate exceeds 5');if((d.stats?.finalists||0)>3)throw new Error('finalists exceeds 3');for(const x of d.items||[]){if(x.stage==='FINALIST'&&!x.evidenceReady)throw new Error('finalist without evidence '+x.name)}"
      - name: Generate Category Radar fixture
        run: node scripts/category-radar-postprocess.mjs
      - name: Verify Category Radar data
        run: node -e "const d=require('./category-radar-live.json');if((d.categories||[]).length<20)throw new Error('missing categories');for(const c of d.categories||[]){if(c.products.length>20)throw new Error('category over target '+c.key);if(c.target!==20||c.minimum!==10)throw new Error('bad category targets '+c.key)}"
      - name: Generate Smart Watchlist fixture
        run: node scripts/watchlist-postprocess.mjs
      - name: Generate Free Readiness audit fixture
        run: node scripts/free-readiness-audit.mjs
      - name: Verify generated intelligence JSON
        run: |
          node -e "for(const f of ['market-intelligence-live.json','alerts-live.json','validation-queue-live.json','data-confidence-live.json','category-radar-live.json','free-readiness-live.json','golden-pipeline-live.json','commercial-hardening-live.json']){const d=require('./'+f);if(!d||(!d.version&&f!=='free-readiness-live.json'))throw new Error('invalid '+f)};const r=require('./free-readiness-live.json');if(r.technicalReadiness<88)throw new Error('free readiness below target')"
      - name: Rebuild Organic Rising quality gates
        run: node scripts/organic-rising-quality-postprocess.mjs
      - name: Validate Organic Rising data integrity
        run: node scripts/qa-organic-rising.mjs
      - name: Run tests
        run: npm test
      - name: Validate build
        run: npm run build
