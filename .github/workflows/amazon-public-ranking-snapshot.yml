name: Amazon Public Ranking Snapshot

on:
  workflow_dispatch:
    inputs:
      category_key:
        description: 'Canonical ranking surface key'
        required: false
        default: 'amazon:office-products:best-sellers'
      category_label:
        description: 'Human-readable category label'
        required: false
        default: 'Office Products'
      source_url:
        description: 'Amazon public Best Sellers URL'
        required: false
        default: 'https://www.amazon.com/gp/bestsellers/office-products?language=en_US'
  push:
    branches:
      - main
    paths:
      - 'data/amazon-office-ranking-trigger-2026-08-26.json'
      - 'data/amazon-office-ranking-page2-trigger-2026-08-26.json'

permissions:
  contents: read

env:
  RANKING_CATEGORY_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.category_key || 'amazon:office-products:best-sellers' }}
  RANKING_CATEGORY_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.category_label || 'Office Products' }}
  RANKING_SOURCE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.source_url || 'https://www.amazon.com/gp/bestsellers/office-products?pg=2&language=en_US' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate one-time ranking trigger policy
        if: github.event_name == 'push'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='data/amazon-office-ranking-page2-trigger-2026-08-26.json';
          if(!fs.existsSync(p)) throw new Error('RANKING_PAGE2_TRIGGER_MARKER_MISSING');
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.triggerId!=='AMAZON_OFFICE_PRODUCTS_RANKING_PAGE2_2026_08_26') throw new Error('RANKING_PAGE2_TRIGGER_ID_INVALID');
          if(x.categoryKey!=='amazon:office-products:best-sellers') throw new Error('RANKING_TRIGGER_CATEGORY_INVALID');
          if(x.page!==2) throw new Error('RANKING_TRIGGER_PAGE_INVALID');
          if(x.providerSpendEur!==0||x.paidCallsAuthorized!==false||x.purchaseAuthorized!==false) throw new Error('RANKING_TRIGGER_POLICY_INVALID');
          NODE
      - name: Collect explicit Amazon public ranking evidence
        id: collect
        continue-on-error: true
        run: >-
          node scripts/amazon-public-ranking-snapshot.mjs
          --categoryKey="${RANKING_CATEGORY_KEY}"
          --categoryLabel="${RANKING_CATEGORY_LABEL}"
          --url="${RANKING_SOURCE_URL}"
          --out=artifacts/amazon-public-ranking-snapshot.json
      - name: Enforce fail-closed evidence policy
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='artifacts/amazon-public-ranking-snapshot.json';
          if(!fs.existsSync(p)){console.error('AMAZON_RANKING_ARTIFACT_MISSING');process.exit(1)}
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log(`status=${x.status}`);
          console.log(`rankEvidenceCount=${x.rankEvidenceCount}`);
          console.log(`diagnostics=${JSON.stringify(x.diagnostics||[])}`);
          if(x.policy?.providerSpendEur!==0||x.policy?.paidCallsTriggered!==0)process.exitCode=3;
          if(x.policy?.purchaseAuthorized!==false)process.exitCode=4;
          if(x.policy?.explicitRankOnly!==true||x.policy?.htmlPositionIsNotRank!==true)process.exitCode=5;
          if((x.observations||[]).some(o=>o.salesEvidenceClass!=='NOT_VERIFIED_SALES'||o.rankEvidenceClass!=='EXPLICIT_PUBLIC_RANK_BADGE'||o.purchaseAuthorized!==false))process.exitCode=6;
          if(x.status!=='RANKING_EVIDENCE_CAPTURED'||Number(x.rankEvidenceCount)<5)process.exitCode=2;
          NODE
      - name: Upload ranking artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-public-ranking-snapshot
          path: artifacts/amazon-public-ranking-snapshot.json
          if-no-files-found: error
          retention-days: 7
