name: G2 Amazon Canonical 10K Import R1

on:
  pull_request:
    paths:
      - '.github/workflows/g2-amazon-canonical-10k-import-r1.yml'
      - 'scripts/build-amazon-canonical-10k-r1.py'
      - 'data/real-products-1000.compact.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/g2-amazon-canonical-10k-import-r1.yml'
      - 'scripts/build-amazon-canonical-10k-r1.py'
      - 'data/real-products-1000.compact.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: g2-amazon-canonical-10k-import-r1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned licensed public Amazon dataset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://raw.githubusercontent.com/the-markup/investigation-amazon-brands/master/data/output/datasets/products.csv.xz' \
            --output amazon-markup-products.csv.xz
          echo '77fd690fc627b05ca68bd0ba3e7217b7a401e364d96eb6308d502ace92c737e9  amazon-markup-products.csv.xz' | sha256sum --check --strict
      - name: Rebuild exact 9K payload
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-amazon-canonical-10k-r1.py \
            amazon-markup-products.csv.xz \
            data/real-products-1000.compact.json \
            amazon-canonical-new-9000-r1.json \
            amazon-canonical-10k-build-receipt-r1.json | tee amazon-canonical-10k-build-summary.txt
          jq -e '
            .newCount == 9000 and
            .combinedCount == 10000 and
            .batchSize == 250 and
            .batchCount == 36 and
            .newRowsSha256 == "e8b53b0aceb7e5847e2f468a64fc8c2c4ce620d8cce5129daa7f3094c4dd1787" and
            .combinedAsinSetSha256 == "7cbd46e5fd861c8ccecd4533ba853d6189447c48df09a55621522fb25e87259c" and
            (.batchDigestsSha256|length) == 36 and
            .policy.databaseWrites == 0 and
            .policy.providerSpendEur == 0 and
            .policy.paidCallsTriggered == 0 and
            .policy.purchaseAuthorized == false
          ' amazon-canonical-10k-build-receipt-r1.json >/dev/null
      - name: Preserve validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: g2-amazon-canonical-10k-import-validation-${{ github.sha }}
          path: |
            amazon-canonical-10k-build-receipt-r1.json
            amazon-canonical-10k-build-summary.txt
          retention-days: 30

  import:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned licensed public Amazon dataset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://raw.githubusercontent.com/the-markup/investigation-amazon-brands/master/data/output/datasets/products.csv.xz' \
            --output amazon-markup-products.csv.xz
          echo '77fd690fc627b05ca68bd0ba3e7217b7a401e364d96eb6308d502ace92c737e9  amazon-markup-products.csv.xz' | sha256sum --check --strict
      - name: Rebuild exact pinned payload
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-amazon-canonical-10k-r1.py \
            amazon-markup-products.csv.xz \
            data/real-products-1000.compact.json \
            amazon-canonical-new-9000-r1.json \
            amazon-canonical-10k-build-receipt-r1.json >/dev/null
          jq -e '
            .newRowsSha256 == "e8b53b0aceb7e5847e2f468a64fc8c2c4ce620d8cce5129daa7f3094c4dd1787" and
            .combinedAsinSetSha256 == "7cbd46e5fd861c8ccecd4533ba853d6189447c48df09a55621522fb25e87259c" and
            .batchCount == 36 and .batchSize == 250
          ' amazon-canonical-10k-build-receipt-r1.json >/dev/null
      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mpr-amazon-canonical-scale-10k")"
          TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Import 36 exact batches
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          EDGE_URL: https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/github-oidc-amazon-canonical-scale-10k-r1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p batch-receipts
          for i in $(seq 0 35); do
            start=$((i * 250))
            end=$((start + 250))
            jq ".rows[$start:$end]" amazon-canonical-new-9000-r1.json > batch.json
            DIGEST="$(jq -r ".batchDigestsSha256[$i]" amazon-canonical-10k-build-receipt-r1.json)"
            jq -n \
              --arg expectedSha "$GITHUB_SHA" \
              --arg sourceSha256 "77fd690fc627b05ca68bd0ba3e7217b7a401e364d96eb6308d502ace92c737e9" \
              --arg newRowsSha256 "e8b53b0aceb7e5847e2f468a64fc8c2c4ce620d8cce5129daa7f3094c4dd1787" \
              --arg combinedAsinSetSha256 "7cbd46e5fd861c8ccecd4533ba853d6189447c48df09a55621522fb25e87259c" \
              --arg batchDigestSha256 "$DIGEST" \
              --argjson batchIndex "$i" \
              --slurpfile rows batch.json \
              '{action:"importBatch",expectedSha:$expectedSha,sourceSha256:$sourceSha256,newRowsSha256:$newRowsSha256,combinedAsinSetSha256:$combinedAsinSetSha256,batchIndex:$batchIndex,batchCount:36,batchDigestSha256:$batchDigestSha256,rows:$rows[0]}' \
              > request.json
            HTTP="$(curl --silent --show-error --output "batch-receipts/batch-$i.json" --write-out '%{http_code}' \
              -X POST "$EDGE_URL" \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H 'content-type: application/json' \
              --data-binary @request.json)"
            test "$HTTP" = "200" || { cat "batch-receipts/batch-$i.json"; exit 1; }
            jq -e --argjson i "$i" '
              .ok == true and
              .schemaVersion == "MPR_AMAZON_CANONICAL_SCALE_10K_BATCH_OIDC_RECEIPT_V1" and
              .batchIndex == $i and
              .resolvedCount == 250 and
              .rejectedCount == 0 and
              .policy.providerSpendEur == 0 and
              .policy.paidCallsTriggered == 0 and
              .policy.purchaseAuthorized == false
            ' "batch-receipts/batch-$i.json" >/dev/null
          done
      - name: Finalize exact Amazon alias count
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          EDGE_URL: https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/github-oidc-amazon-canonical-scale-10k-r1
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg expectedSha "$GITHUB_SHA" \
            '{action:"finalize",expectedSha:$expectedSha,sourceSha256:"77fd690fc627b05ca68bd0ba3e7217b7a401e364d96eb6308d502ace92c737e9",newRowsSha256:"e8b53b0aceb7e5847e2f468a64fc8c2c4ce620d8cce5129daa7f3094c4dd1787",combinedAsinSetSha256:"7cbd46e5fd861c8ccecd4533ba853d6189447c48df09a55621522fb25e87259c"}' > finalize-request.json
          HTTP="$(curl --silent --show-error --output final-receipt.json --write-out '%{http_code}' \
            -X POST "$EDGE_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data-binary @finalize-request.json)"
          test "$HTTP" = "200" || { cat final-receipt.json; exit 1; }
          cat final-receipt.json | jq .
          jq -e '
            .ok == true and
            .schemaVersion == "MPR_AMAZON_CANONICAL_SCALE_10K_OIDC_RECEIPT_V1" and
            .amazonAliasCount == 10000 and
            .newRowsSha256 == "e8b53b0aceb7e5847e2f468a64fc8c2c4ce620d8cce5129daa7f3094c4dd1787" and
            .combinedAsinSetSha256 == "7cbd46e5fd861c8ccecd4533ba853d6189447c48df09a55621522fb25e87259c" and
            .policy.providerSpendEur == 0 and
            .policy.paidCallsTriggered == 0 and
            .policy.purchaseAuthorized == false
          ' final-receipt.json >/dev/null
      - name: Preserve import receipts
        uses: actions/upload-artifact@v4
        with:
          name: g2-amazon-canonical-10k-import-r1-${{ github.sha }}
          path: |
            batch-receipts/
            final-receipt.json
            amazon-canonical-10k-build-receipt-r1.json
          retention-days: 30
