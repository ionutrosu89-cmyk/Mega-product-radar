name: Mega Radar Temporary Kick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Mega Product Radar Scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar-scan.yml --ref main
