name: Amazon Leader BSR Round 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/amazon-leader-bsr-round2-trigger-2026-08-29.json'

permissions:
  contents: read

jobs:
  collect-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate zero-cost one-time trigger
        if: github.event_name == 'push'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='data/amazon-leader-bsr-round2-trigger-2026-08-29.json';
          if(!fs.existsSync(p)) throw new Error('LEADER_BSR_ROUND2_TRIGGER_MISSING');
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.triggerId!=='AMAZON_LEADER_BSR_ROUND2_2026_08_29') throw new Error('LEADER_BSR_ROUND2_TRIGGER_INVALID');
          if(x.providerSpendEur!==0||x.paidCallsAuthorized!==false||x.purchaseAuthorized!==false) throw new Error('LEADER_BSR_ROUND2_POLICY_INVALID');
          if(x.salesEvidenceClass!=='NOT_VERIFIED_SALES'||x.rankEvidencePolicy!=='EXPLICIT_PRODUCT_BSR_ONLY') throw new Error('LEADER_BSR_ROUND2_TRUTH_INVALID');
          const notBefore=Date.parse(x.notBefore||'');
          if(!Number.isFinite(notBefore)||Date.now()<notBefore) throw new Error('LEADER_BSR_ROUND2_TOO_EARLY');
          NODE
      - name: Enforce minimum 24h eligibility before network collection
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('data/amazon-leader-bsr-baseline-2026-08-26-v1.json','utf8'));
          const first=Date.parse(b.observedAt),now=Date.now();
          const elapsed=(now-first)/36e5;
          console.log(`baselineObservedAt=${b.observedAt}`);
          console.log(`elapsedHours=${elapsed.toFixed(4)}`);
          if(!Number.isFinite(first)||elapsed<24) throw new Error('MINIMUM_24H_INTERVAL_NOT_MET');
          if(b.policy?.providerSpendEur!==0||b.policy?.paidCallsTriggered!==0||b.policy?.purchaseAuthorized!==false) throw new Error('BASELINE_POLICY_INVALID');
          NODE
      - name: Collect second explicit product BSR snapshot
        run: node scripts/amazon-leader-bsr-snapshot.mjs --out=artifacts/amazon-leader-bsr-snapshot-round2.json
      - name: Build same-category longitudinal rank history
        run: >-
          node scripts/amazon-leader-bsr-round2-history.mjs
          --baseline=data/amazon-leader-bsr-baseline-2026-08-26-v1.json
          --current=artifacts/amazon-leader-bsr-snapshot-round2.json
          --out=artifacts/amazon-leader-bsr-history-round2.json
      - name: Enforce longitudinal BSR truth gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('artifacts/amazon-leader-bsr-snapshot-round2.json','utf8'));
          const h=JSON.parse(fs.readFileSync('artifacts/amazon-leader-bsr-history-round2.json','utf8'));
          console.log(`productsWithExplicitBsr=${s.productsWithExplicitBsr}`);
          console.log(`eligibleProductCount=${h.eligibleProductCount||0}`);
          console.log(`conflictProductCount=${h.conflictProductCount||0}`);
          console.log(`comparableCategoryCount=${h.comparableCategoryCount||0}`);
          if(h.ok!==true||Number(h.elapsedHours)<24)process.exitCode=2;
          if(h.salesEvidenceClass!=='NOT_VERIFIED_SALES'||h.verifiedSalesRows!==0||h.paidCallsTriggered!==0||h.purchaseAuthorized!==false)process.exitCode=3;
          if((h.rows||[]).some(r=>r.categorySignalsConflict===true&&r.rankVelocityPerDay!==null))process.exitCode=4;
          if((h.categoryRows||[]).some(r=>r.evidenceClass!=='LONGITUDINAL_EXPLICIT_PRODUCT_BSR_CATEGORY'||r.salesEvidenceClass!=='NOT_VERIFIED_SALES'||r.purchaseAuthorized!==false))process.exitCode=5;
          NODE
      - name: Fuse clean review and rank evidence
        run: >-
          node scripts/amazon-strict-trend-fusion.mjs
          --leaders=data/amazon-round2-preliminary-leaders-v1.json
          --rank=artifacts/amazon-leader-bsr-history-round2.json
          --out=artifacts/amazon-strict-trend-fusion-round2.json
      - name: Enforce trend fusion truth gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('artifacts/amazon-strict-trend-fusion-round2.json','utf8'));
          console.log(`fusionStatus=${f.status}`);
          console.log(`confirmedAccelerationCount=${f.confirmedAccelerationCount||0}`);
          console.log(`confirmedAsins=${JSON.stringify(f.confirmedAsins||[])}`);
          if(f.ok!==true)process.exitCode=2;
          if(f.salesEvidenceClass!=='NOT_VERIFIED_SALES'||f.verifiedSalesRows!==0||f.paidCallsTriggered!==0||f.providerSpendEur!==0||f.purchaseAuthorized!==false)process.exitCode=3;
          if((f.rows||[]).some(r=>r.confirmedAcceleration===true&&(r.rankSignal?.rankVelocityPerDay<=0||r.reviewSignal?.reviewDelta<=0)))process.exitCode=4;
          NODE
      - name: Evaluate candidate importability and business fit
        run: >-
          node scripts/importability-business-fit.mjs
          --asin=B00INKVS82
          --profile=data/importability-profile-b00inkvs82-v1.json
          --out=artifacts/importability-business-fit-b00inkvs82.json
      - name: Enforce importability safety truth gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const i=JSON.parse(fs.readFileSync('artifacts/importability-business-fit-b00inkvs82.json','utf8'));
          console.log(`importabilityStatus=${i.status}`);
          console.log(`unknowns=${JSON.stringify(i.unknowns||[])}`);
          console.log(`hardBlockers=${JSON.stringify(i.hardBlockers||[])}`);
          if(i.purchaseAuthorized!==false||i.paidCallsTriggered!==0||i.providerSpendEur!==0)process.exitCode=2;
          if(i.importabilityPassed===true&&i.status!=='IMPORTABILITY_PASS')process.exitCode=3;
          NODE
      - name: Build First Finalist decision packet
        run: >-
          node scripts/first-finalist-decision.mjs
          --asin=B00INKVS82
          --fusion=artifacts/amazon-strict-trend-fusion-round2.json
          --romania=data/romania-binder-manual-exact-evidence-b00inkvs82-v1.json
          --importability=artifacts/importability-business-fit-b00inkvs82.json
          --supplier=supplier-evidence/manual-verification-packets-v1.json
          --economics=data/landed-economics-readiness-v1.json
          --out=artifacts/first-finalist-decision-round2.json
      - name: Enforce First Finalist and canonical decision truth gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('artifacts/first-finalist-decision-round2.json','utf8'));
          const c=d.canonicalDecision||{};
          console.log(`decisionStatus=${d.status}`);
          console.log(`canonicalStage=${c.stage}`);
          console.log(`gates=${JSON.stringify(d.gates)}`);
          console.log(`blockers=${JSON.stringify(d.blockers)}`);
          console.log(`supplierSourcingEligible=${d.supplierSourcingEligible}`);
          if(d.purchaseAuthorized!==false||d.paidCallsTriggered!==0||d.providerSpendEur!==0||d.salesEvidenceClass!=='NOT_VERIFIED_SALES'||d.verifiedSalesRows!==0)process.exitCode=2;
          if(d.finalistEvidenceReady===true && (!d.gates?.trendConfirmed||!d.gates?.romaniaGapConfirmed||!d.gates?.importabilityPassed||!d.gates?.supplierVerified||!d.gates?.economicsConfirmed))process.exitCode=3;
          if(d.testReady!==false)process.exitCode=4;
          if(c.authority!=='EVIDENCE_DRIVEN_CANONICAL_DECISION'||c.purchaseAuthorized!==false||c.automaticPurchaseAllowed!==false)process.exitCode=5;
          if(c.stage==='FINALIST'&&d.finalistEvidenceReady!==true)process.exitCode=6;
          if(['TEST_READY','TEST_RUNNING','TEST_VALIDATED','BUY_READY'].includes(c.stage))process.exitCode=7;
          NODE
      - name: Run BSR, fusion, importability and canonical decision unit tests
        run: node --test test/amazon-leader-bsr-history-v1.test.js test/amazon-strict-trend-fusion-v1.test.mjs test/importability-business-fit-gate-v1.test.mjs test/first-finalist-decision-gate-v1.test.mjs test/single-decision-authority-v1.test.mjs
      - name: Upload Round 2 BSR, fusion, importability and decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-leader-bsr-round2-evidence
          path: |
            artifacts/amazon-leader-bsr-snapshot-round2.json
            artifacts/amazon-leader-bsr-history-round2.json
            artifacts/amazon-strict-trend-fusion-round2.json
            artifacts/importability-business-fit-b00inkvs82.json
            artifacts/first-finalist-decision-round2.json
          if-no-files-found: error
          retention-days: 7
