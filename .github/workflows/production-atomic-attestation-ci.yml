name: Production Atomic Attestation CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production-atomic-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Syntax check production atomic attestation
        run: |
          node --check production-atomic-store-attestation-v1.js
          node --check scripts/run-production-atomic-store-attestation.mjs
      - name: Run production atomic attestation unit tests
        run: node --test test/production-atomic-store-attestation-v1.test.mjs
      - name: Validate local attestation fail-closed
        run: |
          npm run ranking:atomic-attestation -- --out=artifacts/ci-production-atomic-attestation.json
          node <<'NODE'
          const d=require('./artifacts/ci-production-atomic-attestation.json');
          if(d.decision!=='HOLD_PRODUCTION_ATOMICITY')throw new Error('local atomic attestation must HOLD');
          if(d.productionAtomicityVerified!==false||d.distributedLockingVerified!==false||d.exactlyOnceGuaranteed!==false)throw new Error('local atomic attestation promoted to production');
          if(d.readiness?.productionAtomicityVerified!==false)throw new Error('local store readiness unexpectedly verified');
          if(d.providerDataSpendEur!==0||d.paidDataCallsTriggered!==0||d.purchaseAuthorized!==false)throw new Error('policy invariant violation');
          if(d.salesEvidenceClass!=='NOT_VERIFIED_SALES'||d.verifiedSalesRows!==0)throw new Error('truth invariant violation');
          NODE
