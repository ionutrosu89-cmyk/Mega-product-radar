name: Public Sales Evidence V1

on:
  push:
    branches: [main]
    paths:
      - 'data/public-sales-evidence/**'
      - 'public-sales-estimation-v1.js'
      - 'scripts/public-sales-evidence.mjs'
      - 'scripts/commercial-hardening.mjs'
      - 'scripts/test-buy-decision.mjs'
      - 'scripts/finalist-evidence-queue.mjs'
      - 'scripts/finalist-economics-packet-v1.mjs'
      - 'freight-mode-viability-v1.js'
      - 'consolidation-engine-v1.js'
      - 'consolidation-basket-v1.js'
      - 'scripts/consolidation-basket-live.mjs'
      - 'price-strategy-v1.js'
      - 'finalist-test-gate-v1.js'
      - 'import-cost-stress-v1.js'
      - 'shipment-fixed-cost-stress-v1.js'
      - 'lcl-local-charge-guard-v1.js'
      - 'customs-duty-sensitivity-v1.js'
      - 'data/freight-benchmarks/china-romania-lcl-public-range-2026-09-06.json'
      - 'data/import-processing/**'
      - 'data/romania-pricing/**'
      - 'data/consolidation/**'
      - 'data/customs-classification/**'
      - 'supplier-candidates/**'
      - '.github/workflows/public-sales-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-sales-evidence-v1
  cancel-in-progress: true

jobs:
  apply-public-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply public third-party sales estimates
        run: node scripts/public-sales-evidence.mjs
      - name: Rebuild downstream gates
        run: |
          node scripts/supplier-page-evidence-collector.mjs
          node scripts/commercial-hardening.mjs
          node scripts/test-buy-decision.mjs
          node scripts/golden-product-pipeline.mjs --phase=final
          node scripts/finalist-evidence-queue.mjs
          node scripts/consolidation-basket-live.mjs
          node scripts/finalist-economics-packet-v1.mjs
      - name: Verify truth boundary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('public-sales-estimation-live.json','utf8'));
          for(const x of d.items||[]){
            if(x.verifiedCompetitorSales===true||x.actualObservedSales===true)throw new Error('PUBLIC_ESTIMATE_PROMOTED_TO_VERIFIED_SALES');
            if(x.status==='ESTIMATED_HIGH_CONFIDENCE'&&Number(x.confidence||0)<75)throw new Error('HIGH_CONFIDENCE_BELOW_THRESHOLD');
          }
          NODE
      - name: Persist public sales evidence outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-intelligence-live.json public-sales-estimation-live.json supplier-page-evidence-live.json commercial-hardening-live.json golden-pipeline-live.json finalist-evidence-queue-live.json consolidation-basket-live.json finalist-economics-live.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist public sales estimation evidence"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
