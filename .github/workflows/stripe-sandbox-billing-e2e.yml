name: Stripe Sandbox Billing E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS deployment URL (optional; falls back to repository variable, then canonical Netlify production URL)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .billing-e2e-trigger

permissions:
  contents: read
  id-token: write

concurrency:
  group: stripe-sandbox-billing-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stripe-sandbox-e2e:
    name: Stripe sandbox billing E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPR_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.MPR_BASE_URL || 'https://mega-product-radar.netlify.app' }}
      MPR_DEPLOYMENT_GATE: SANDBOX
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Declare sandbox-only execution
        shell: bash
        run: |
          echo "### Stripe Sandbox Billing E2E" >> "$GITHUB_STEP_SUMMARY"
          node -e "const u=new URL(process.env.MPR_BASE_URL);if(u.protocol!=='https:')throw new Error('Deployment target must use HTTPS');console.log('Target:',u.origin)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: Stripe TEST/SANDBOX only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Real-money authority: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Entitlement authority: WEBHOOK ONLY" >> "$GITHUB_STEP_SUMMARY"

      - name: Mint short-lived readiness credential
        run: node scripts/github-actions-readiness-oidc.mjs

      - name: Ensure clean sandbox workspace
        shell: bash
        run: |
          set -euo pipefail
          preflight_url="${MPR_BASE_URL%/}/api/internal/sandbox-preflight-readiness"
          transition_url="${MPR_BASE_URL%/}/api/internal/billing-e2e-sandbox-transition"
          auth_header="Authorization: Bearer ${MPR_READINESS_PROBE_TOKEN}"
          curl --fail-with-body --silent --show-error -H "$auth_header" "$preflight_url" -o /tmp/sandbox-preflight.json
          if jq -e '.ok==true and .ready==true' /tmp/sandbox-preflight.json >/dev/null; then
            echo "Sandbox workspace already clean."
          else
            jq -n '{action:"CLEAN_SANDBOX"}' >/tmp/sandbox-cleanup.json
            curl --fail-with-body --silent --show-error -X POST "$transition_url"               -H "$auth_header"               -H "x-mpr-deployment-ref: $GITHUB_SHA"               -H 'content-type: application/json'               --data-binary @/tmp/sandbox-cleanup.json               -o /tmp/sandbox-cleanup-response.json
            jq -e '.ok==true and .realMoney==false and .stripeMode=="SANDBOX" and .entitlementAuthority=="WEBHOOK_ONLY"' /tmp/sandbox-cleanup-response.json >/dev/null
            clean=false
            for attempt in $(seq 1 30); do
              sleep 2
              curl --fail-with-body --silent --show-error -H "$auth_header" "$preflight_url" -o /tmp/sandbox-preflight.json
              if jq -e '.ok==true and .ready==true' /tmp/sandbox-preflight.json >/dev/null; then
                clean=true
                break
              fi
            done
            if [ "$clean" != "true" ]; then
              jq . /tmp/sandbox-preflight.json
              echo "SANDBOX_WORKSPACE_CLEANUP_TIMEOUT" >&2
              exit 1
            fi
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Verify sandbox deployment preflight
        run: npm run verify:paid-beta-deployment

      - name: Ensure verified FREE baseline for this deployment SHA
        run: node scripts/ensure-free-baseline.mjs

      - name: Run resumable Stripe sandbox journey
        run: npm run verify:stripe-sandbox-e2e

      - name: Record machine GO summary
        if: success()
        shell: bash
        run: |
          echo "- Stripe sandbox billing journey: 6/6 GO" >> "$GITHUB_STEP_SUMMARY"
          echo "- No live charge was authorized or executed." >> "$GITHUB_STEP_SUMMARY"
