name: Live Observation Inbox CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

concurrency:
  group: live-observation-inbox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Syntax check inbox boundary
        run: |
          node --check live-observation-inbox-v1.js
          node --check scripts/run-live-observation-inbox.mjs
      - name: Run inbox unit tests
        run: node --test test/live-observation-inbox-v1.test.mjs
      - name: Validate local inbox fail-closed
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('fs');
          const audit={
            generatedAt:'2026-08-27T10:00:00Z',
            rankingSignalResolution:{
              manifest:{schema:'MPR_RANKING_SIGNAL_RESOLVED_BUNDLE_V1',fingerprint:'ci-inbox-bundle-1',asOf:'2026-08-27T10:00:00Z'},
              trustedRecords:[],heldRecords:[]
            }
          };
          fs.writeFileSync('artifacts/ci-live-inbox-input.json',JSON.stringify(audit,null,2));
          NODE
          MPR_PRODUCTION_SCHEDULER_ATTESTATION_ENABLED=false npm run ranking:inbox -- --input=artifacts/ci-live-inbox-input.json --output=artifacts/ci-live-inbox-audit.json --storeRoot=artifacts/ci-live-inbox-store --now=2026-08-27T10:30:00Z
          node <<'NODE'
          const d=require('./artifacts/ci-live-inbox-audit.json');
          if(d.decision!=='READY')throw new Error('local inbox should be analysis-ready');
          if(d.read?.analysisRunnable!==true)throw new Error('analysis inbox did not become runnable');
          if(d.read?.productionRunnable===true)throw new Error('local inbox promoted to production');
          if(d.productionSchedulerEnabled!==false||d.productionSchedulerAttested!==false)throw new Error('production scheduler unexpectedly enabled');
          if(d.policy?.providerDataSpendEur!==0||d.policy?.paidDataCallsTriggered!==0||d.policy?.purchaseAuthorized!==false)throw new Error('inbox policy invariant violation');
          if(d.policy?.verifiedSalesRows!==0||d.policy?.salesEvidenceClass!=='NOT_VERIFIED_SALES')throw new Error('inbox truth class violation');
          NODE
      - name: Validate missing input waits safely
        run: |
          npm run ranking:inbox -- --input=artifacts/does-not-exist.json --output=artifacts/ci-live-inbox-missing.json
          node <<'NODE'
          const d=require('./artifacts/ci-live-inbox-missing.json');
          if(d.decision!=='WAIT')throw new Error('missing inbox input must WAIT');
          NODE
