name: First Mega Radar Scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/first-scan.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: first-radar-scan
  cancel-in-progress: false

jobs:
  first-scan:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout radar
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DLLAMA_CURL=ON
          cmake --build llama.cpp/build --config Release -j 2 --target llama-cli
      - name: Run zero-cost local AI product scan
        id: scan
        continue-on-error: true
        env:
          LLAMA_CLI: ./llama.cpp/build/bin/llama-cli
          LOCAL_MODEL: Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
        run: node scripts/run-github-scan.mjs
      - name: Persist scan result in repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan-status.json radar-live.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Mega Radar local AI scan result"
            git push
          fi
      - name: Build static site folder
        if: always()
        run: |
          mkdir -p _site
          cp index.html app.js manifest.json products.json radar-live.json scan-status.json _site/
          touch _site/.nojekyll
      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site with fresh radar data
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy fresh radar
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
