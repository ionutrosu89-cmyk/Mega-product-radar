name: Catalog Prioritization CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'catalog-prioritization-v1.js'
      - 'test/catalog-prioritization-v1.test.mjs'
      - '.github/workflows/catalog-prioritization-ci.yml'
  push:
    branches: [main]
    paths:
      - 'catalog-prioritization-v1.js'
      - 'test/catalog-prioritization-v1.test.mjs'
      - '.github/workflows/catalog-prioritization-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check catalog-prioritization-v1.js
      - name: Targeted tests
        run: node --test test/catalog-prioritization-v1.test.mjs
      - name: Production safety gate
        run: npm run verify:production-safety
