name: Open Food Facts Stream Pilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Syntax checks
        run: |
          node --check open-food-facts-stream-pilot-v1.js
          node --check scripts/run-open-food-facts-stream-pilot.mjs
      - name: Targeted tests
        run: node --test test/open-food-facts-stream-pilot-v1.test.mjs
      - name: Local fixture stays fail-closed
        run: |
          rm -rf artifacts/off-official-stream-pilot-v1
          npm run ingest:off-pilot
          node -e "const x=require('./artifacts/off-official-stream-pilot-v1/summary.json'); if(x.remoteFetchEnabled||x.productionCatalogWritePerformed||x.productionScaleAuthorized||x.tenKCandidateSet||x.policy.purchaseAuthorized||x.policy.providerDataSpendEur!==0||x.policy.paidDataCallsTriggered!==0) process.exit(1)"
      - name: Stream official Open Food Facts export and prove 10K strong-identity dry-run set
        env:
          MPR_OFF_STREAM_FETCH_ENABLED: 'true'
          MPR_OFF_STREAM_MAX_ROWS: '48000'
          MPR_OFF_STREAM_MIN_ROWS: '40000'
          MPR_OFF_STREAM_MIN_ACCEPTED: '10000'
          MPR_OFF_STREAM_MIN_STRONG_IDENTITIES: '10000'
          MPR_OFF_STREAM_REVIEW_SAMPLE: '200'
        run: |
          rm -rf artifacts/off-official-stream-pilot-v1
          npm run ingest:off-pilot
          node -e "const x=require('./artifacts/off-official-stream-pilot-v1/summary.json'); if(!x.remoteFetchEnabled||x.productionCatalogWritePerformed||x.productionScaleAuthorized||x.policy.purchaseAuthorized||x.policy.providerDataSpendEur!==0||x.policy.paidDataCallsTriggered!==0||x.pilot.metrics.projectedRows<40000||x.ingestionStats.accepted<10000||x.ingestionStats.strongIdentityProducts<10000||x.strongCandidateCount<10000||x.reviewSampleCount<200||x.dryRun.decision!=='TEN_K_DRY_RUN_EVIDENCE_READY'||!x.tenKCandidateSet) process.exit(1)"
      - name: Production safety gate
        run: npm run verify:production-safety
      - name: Full test suite
        run: npm test
      - name: Upload pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: off-official-stream-pilot-evidence
          path: artifacts/off-official-stream-pilot-v1/
          if-no-files-found: error
          retention-days: 7
