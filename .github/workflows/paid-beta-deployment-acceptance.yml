name: Paid Beta Deployment Acceptance

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Paid beta gate to verify
        required: true
        default: SANDBOX
        type: choice
        options:
          - SANDBOX
          - LIVE_PREREQS
  push:
    branches:
      - main
    paths:
      - .deploy-trigger

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MPR_BASE_URL: ${{ vars.MPR_BASE_URL }}
      MPR_ADMIN_ACCESS_TOKEN: ${{ secrets.MPR_ADMIN_ACCESS_TOKEN }}
      MPR_DEPLOYMENT_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.gate || 'SANDBOX' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require protected deployment configuration
        shell: bash
        run: |
          echo "### Paid Beta Deployment Acceptance" >> "$GITHUB_STEP_SUMMARY"
          missing=0
          if [[ -z "${MPR_BASE_URL}" ]]; then
            echo "- BLOCKED_CONFIGURATION: repository variable MPR_BASE_URL is missing." >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          if [[ -z "${MPR_ADMIN_ACCESS_TOKEN}" ]]; then
            echo "- BLOCKED_CONFIGURATION: repository secret MPR_ADMIN_ACCESS_TOKEN is missing." >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Paid beta deployment acceptance is NO-GO until protected configuration is present." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Protected deployment configuration is present. Running ${MPR_DEPLOYMENT_GATE} gate." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify paid beta deployment
        run: npm run verify:paid-beta-deployment
