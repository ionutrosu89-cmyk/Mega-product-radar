name: Paid Beta Deployment Acceptance

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Paid beta gate to verify
        required: true
        default: SANDBOX
        type: choice
        options:
          - SANDBOX
          - LIVE_PREREQS
      base_url:
        description: HTTPS deployment URL (optional; falls back to repository variable, then canonical Netlify production URL)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .deploy-trigger

permissions:
  contents: read
  id-token: write

concurrency:
  group: paid-beta-deployment-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-acceptance:
    name: Paid beta deployment acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPR_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.MPR_BASE_URL || 'https://mega-product-radar.netlify.app' }}
      MPR_DEPLOYMENT_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.gate || 'SANDBOX' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require deployment target configuration
        shell: bash
        run: |
          echo "### Paid Beta Deployment Acceptance" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "${MPR_BASE_URL}" ]]; then
            echo "- BLOCKED_CONFIGURATION: deployment URL is missing. Supply workflow input base_url, repository variable MPR_BASE_URL, or restore the canonical Netlify fallback." >> "$GITHUB_STEP_SUMMARY"
            echo "Paid beta deployment acceptance is NO-GO until deployment target configuration is present." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node -e "const u=new URL(process.env.MPR_BASE_URL);if(u.protocol!=='https:')throw new Error('Deployment target must use HTTPS');console.log('Deployment target:',u.origin)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment target configuration is present. Running ${MPR_DEPLOYMENT_GATE} gate." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${MPR_DEPLOYMENT_GATE}" == "SANDBOX" ]]; then
            echo "Dedicated sandbox workspace is resolved server-side; preflight requires FREE plan, zero active/trialing Stripe subscriptions and no scheduled cancellation." >> "$GITHUB_STEP_SUMMARY"
            echo "The automated billing journey is Stripe Test Mode only, uses webhook-backed entitlement authority, and cannot spend real money." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint short-lived readiness credential
        run: node scripts/github-actions-readiness-oidc.mjs

      - name: Verify public deployment is reachable
        shell: bash
        run: |
          if ! curl --fail --silent --show-error --location --max-time 15 "${MPR_BASE_URL%/}/beta.html" -o /dev/null; then
            echo "- SITE_UNREACHABLE: beta.html could not be reached at the deployment target." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- Public deployment reachability: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Verify paid beta deployment
        run: npm run verify:paid-beta-deployment

      - name: Ensure verified FREE baseline
        if: env.MPR_DEPLOYMENT_GATE == 'SANDBOX'
        run: node scripts/ensure-free-baseline.mjs

      - name: Run webhook-backed Stripe sandbox billing journey
        if: env.MPR_DEPLOYMENT_GATE == 'SANDBOX'
        run: npm run verify:stripe-sandbox-e2e
