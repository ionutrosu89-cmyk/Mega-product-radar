name: Paid Beta Deployment Acceptance

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Paid beta gate to verify
        required: true
        default: SANDBOX
        type: choice
        options:
          - SANDBOX
          - LIVE_PREREQS
      base_url:
        description: HTTPS deployment URL (optional; falls back to repository variable MPR_BASE_URL)
        required: false
        type: string
      sandbox_workspace_id:
        description: Dedicated FREE sandbox workspace ID (optional; falls back to repository variable MPR_SANDBOX_WORKSPACE_ID)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .deploy-trigger

permissions:
  contents: read

concurrency:
  group: paid-beta-deployment-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-acceptance:
    name: Paid beta deployment acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPR_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.MPR_BASE_URL }}
      MPR_READINESS_PROBE_TOKEN: ${{ secrets.MPR_READINESS_PROBE_TOKEN }}
      MPR_DEPLOYMENT_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.gate || 'SANDBOX' }}
      MPR_SANDBOX_WORKSPACE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.sandbox_workspace_id || vars.MPR_SANDBOX_WORKSPACE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deployment target and protected probe configuration
        shell: bash
        run: |
          echo "### Paid Beta Deployment Acceptance" >> "$GITHUB_STEP_SUMMARY"
          missing=0
          if [[ -z "${MPR_BASE_URL}" ]]; then
            echo "- BLOCKED_CONFIGURATION: deployment URL is missing. Supply workflow input base_url or repository variable MPR_BASE_URL." >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          if [[ -z "${MPR_READINESS_PROBE_TOKEN}" ]]; then
            echo "- BLOCKED_CONFIGURATION: repository secret MPR_READINESS_PROBE_TOKEN is missing." >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          if [[ "${MPR_DEPLOYMENT_GATE}" == "SANDBOX" && -z "${MPR_SANDBOX_WORKSPACE_ID}" ]]; then
            echo "- BLOCKED_CONFIGURATION: dedicated sandbox workspace is missing. Supply workflow input sandbox_workspace_id or repository variable MPR_SANDBOX_WORKSPACE_ID." >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Paid beta deployment acceptance is NO-GO until protected configuration is present." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node -e "const u=new URL(process.env.MPR_BASE_URL);if(u.protocol!=='https:')throw new Error('Deployment target must use HTTPS');console.log('Deployment target:',u.origin)" >> "$GITHUB_STEP_SUMMARY"
          echo "Protected probe configuration is present. Running ${MPR_DEPLOYMENT_GATE} gate." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${MPR_DEPLOYMENT_GATE}" == "SANDBOX" ]]; then
            echo "Dedicated sandbox workspace preflight is required: FREE plan, zero active/trialing Stripe subscriptions, no scheduled cancellation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify public deployment is reachable
        shell: bash
        run: |
          if ! curl --fail --silent --show-error --location --max-time 15 "${MPR_BASE_URL%/}/beta.html" -o /dev/null; then
            echo "- SITE_UNREACHABLE: beta.html could not be reached at the deployment target." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- Public deployment reachability: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Verify paid beta deployment
        run: npm run verify:paid-beta-deployment
