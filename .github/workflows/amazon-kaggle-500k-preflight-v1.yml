name: Amazon Kaggle 500K Preflight V1

on:
  pull_request:
    paths:
      - 'scripts/preflight-amazon-kaggle-500k-v1.py'
      - '.github/workflows/amazon-kaggle-500k-preflight-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download public Kaggle dataset
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/download/asaniczka/amazon-products-dataset-2023-1-4m-products' \
            --output /tmp/amazon-products-2023.zip
          test -s /tmp/amazon-products-2023.zip
      - name: Verify 500K source qualification
        run: |
          set -euo pipefail
          python3 scripts/preflight-amazon-kaggle-500k-v1.py
      - name: Upload read-only receipt
        uses: actions/upload-artifact@v4
        with:
          name: amazon-kaggle-500k-preflight-v1-${{ github.run_id }}
          path: /tmp/amazon-kaggle-500k-preflight.json
          if-no-files-found: error
          retention-days: 14
