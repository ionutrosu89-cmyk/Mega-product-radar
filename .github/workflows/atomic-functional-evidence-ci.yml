name: Atomic Functional Evidence CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

concurrency:
  group: atomic-functional-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-atomic-functional-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax check functional evidence boundary
        run: |
          node --check atomic-store-functional-evidence-v1.js
          node --check scripts/run-atomic-store-functional-evidence.mjs
      - name: Run functional evidence unit tests
        run: node --test test/atomic-store-functional-evidence-v1.test.mjs
      - name: Validate local functional evidence fail-closed
        run: npm run ranking:atomic-functional-evidence
      - name: Verify production safety gate
        run: npm run verify:production-safety
