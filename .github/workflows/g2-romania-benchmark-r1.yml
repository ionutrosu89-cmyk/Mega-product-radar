name: G2 Romania Benchmark R1

on:
  pull_request:
    paths:
      - 'scripts/select-romania-benchmark-r1.mjs'
      - 'data/real-products-1000.compact.json'
      - '.github/workflows/g2-romania-benchmark-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build deterministic 100-product Romania benchmark
        shell: bash
        run: |
          set -euo pipefail
          node scripts/select-romania-benchmark-r1.mjs data/real-products-1000.compact.json romania-benchmark-r1.json | tee romania-benchmark-summary.json
          jq -e '.schemaVersion == "MPR_ROMANIA_BENCHMARK_R1_V2" and .selectedCount == 100 and .categoryCount >= 20 and .providerSpendEur == 0 and .paidCallsTriggered == 0 and .purchaseAuthorized == false' romania-benchmark-summary.json >/dev/null
      - name: Preserve benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: g2-romania-benchmark-r1-${{ github.sha }}
          path: |
            romania-benchmark-r1.json
            romania-benchmark-summary.json
          retention-days: 30
