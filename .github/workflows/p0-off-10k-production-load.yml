name: P0 OFF 10K Production Load

on:
  pull_request:
    branches: [main]
    paths:
      - 'off-production-load-evidence-v1.js'
      - 'scripts/run-off-production-load-evidence.mjs'
      - 'test/off-production-load-evidence-v1.test.mjs'
      - '.github/workflows/p0-off-10k-production-load.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-off-10k-production-load.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Syntax checks
        run: |
          node --check off-production-load-evidence-v1.js
          node --check scripts/run-off-production-load-evidence.mjs
      - name: Targeted tests
        run: node --test test/off-production-load-evidence-v1.test.mjs
      - name: Production safety gate
        run: npm run verify:production-safety
      - name: Full test suite
        run: npm test

  execute-production-load:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[EXECUTE_OFF_10K_LOAD_V1]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OFF_EVIDENCE_ARTIFACT_ID: '9677332639'
      MPR_OFF_EXPECTED_BUNDLE_SHA256: '75ac97f4f5aaa03368e7bab8015b2fab1d1110524d97cad616929e434df3a72f'
      MPR_OFF_WRITE_CONFIRMATION: 'WRITE_OFF_STRONG_GTIN:75ac97f4f5aaa03368e7bab8015b2fab1d1110524d97cad616929e434df3a72f:10000'
      MPR_OFF_WRITE_TARGET: '10000'
      MPR_OFF_WRITE_BATCH_SIZE: '500'
      MPR_SUPABASE_CATALOG_WRITE_ENABLED: 'true'
      MPR_CATALOG_WORKSPACE_ID: 'f617d7f7-f1af-4421-827d-6526e0d4847e'
      SUPABASE_URL: 'https://xqzsbebbuovcyeyxdqxo.supabase.co'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Verify production secret is configured
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Production safety gate before write
        run: npm run verify:production-safety
      - name: Download pinned OFF 10K evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf artifacts/off-official-stream-pilot-v1 artifacts/off-10k-production-load
          mkdir -p artifacts/off-official-stream-pilot-v1 artifacts/off-10k-production-load
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${OFF_EVIDENCE_ARTIFACT_ID}/zip" > /tmp/off-evidence.zip
          unzip -q /tmp/off-evidence.zip -d artifacts/off-official-stream-pilot-v1
      - name: Verify pinned source evidence
        run: |
          test "$(jq -r .bundleSha256 artifacts/off-official-stream-pilot-v1/persistence-bundle.json)" = "$MPR_OFF_EXPECTED_BUNDLE_SHA256"
          test "$(jq -r .dryRun.decision artifacts/off-official-stream-pilot-v1/summary.json)" = "TEN_K_DRY_RUN_EVIDENCE_READY"
          test "$(jq -r .strongCandidateCount artifacts/off-official-stream-pilot-v1/summary.json)" -ge 10000
      - name: Execute controlled 10K strong-GTIN production write
        run: |
          npm run ingest:off-controlled-write -- --bundle=artifacts/off-official-stream-pilot-v1/persistence-bundle.json --target=10000 --batchSize=500 | tee artifacts/off-10k-production-load/write-receipt.json
          node -e "const x=require('./artifacts/off-10k-production-load/write-receipt.json'); if(!x.productionWritePerformed||x.targetProducts!==10000||x.completedBatchCount!==20||x.productionScaleAuthorized||x.commercialUseAuthorized||x.providerDataSpendEur!==0||x.paidDataCallsTriggered!==0||x.purchaseAuthorized||x.verifiedSalesRows!==0||x.salesEvidenceClass!=='NOT_VERIFIED_SALES') process.exit(1)"
      - name: Verify persisted 10K inventory and provenance
        run: node scripts/run-off-production-load-evidence.mjs
      - name: Upload production load evidence
        uses: actions/upload-artifact@v4
        with:
          name: off-10k-production-load-evidence
          path: artifacts/off-10k-production-load/
          if-no-files-found: error
          retention-days: 30
