name: Mega Product Radar Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-scan.yml'
      - 'scripts/**'
      - 'v6-core.js'
      - 'discovery-catalogue.json'
      - 'discovery-themes.json'
      - 'discovery-themes-wide.json'
      - 'organic-rising-config.json'
      - 'discovery-engine.js'
      - 'discovery-history.js'
      - 'review-intelligence.js'
      - '.deploy-trigger'
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 9 * * *'
    - cron: '30 15 * * *'
    - cron: '30 21 * * *'

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout radar
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Radar V2 + Wide Product Discovery + Organic Rising scan
        id: scan
        continue-on-error: true
        run: node scripts/run-github-scan.mjs

      - name: Enrich real product preview images
        if: always()
        continue-on-error: true
        run: node scripts/enrich-discovery-images.mjs

      - name: Persist radar, discovery, organic histories and scan status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-live.json radar-history.json discovery-live.json discovery-history.json organic-rising-live.json organic-rising-history.json scan-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Mega Product Radar V2 scan"
            git pull --rebase origin main
            git push origin main
          else
            echo "No radar data changes to commit."
          fi

      - name: Validate current Radar V2 site
        if: always()
        run: |
          node scripts/build-site.mjs
          node scripts/qa-mobile.mjs

      - name: Explain Pages publishing
        if: always()
        run: echo "GitHub Pages publishes the committed root automatically."
