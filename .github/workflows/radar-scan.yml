name: Mega Product Radar Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-scan.yml'
      - 'scripts/**'
      - '.deploy-trigger'
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout radar
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run zero-cost live web radar scan
        id: scan
        continue-on-error: true
        run: node scripts/run-github-scan.mjs

      - name: Persist radar data and scan status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-live.json scan-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Mega Product Radar daily scan"
            git push
          else
            echo "No radar data changes to commit."
          fi

      - name: Build current Pages artifact
        if: always()
        run: |
          mkdir -p _site
          cp index.html app.js manifest.json products.json radar-live.json scan-status.json _site/
          touch _site/.nojekyll

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed radar
        id: deployment
        uses: actions/deploy-pages@v4
