name: Mega Product Radar Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-scan.yml'
      - 'scripts/**'
      - 'discovery-catalogue.json'
      - 'discovery-themes.json'
      - 'discovery-engine.js'
      - 'discovery-history.js'
      - 'review-intelligence.js'
      - '.deploy-trigger'
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout radar
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Radar 5.7 + Product Discovery scan
        id: scan
        continue-on-error: true
        run: node scripts/run-github-scan.mjs

      - name: Persist radar, discovery, histories and scan status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-live.json radar-history.json discovery-live.json discovery-history.json scan-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Mega Product Radar 5.7 daily scan"
            git push
          else
            echo "No radar data changes to commit."
          fi

      - name: Validate current Radar 5.7 site
        if: always()
        run: |
          node scripts/build-site.mjs
          node scripts/qa-mobile.mjs

      - name: Explain Pages publishing
        if: always()
        run: echo "GitHub Pages is configured as legacy main:/ and publishes the committed root automatically; no duplicate deploy-pages call is needed."
