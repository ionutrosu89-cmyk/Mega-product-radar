name: Mega Product Radar Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-scan.yml'
      - 'scripts/**'
      - 'v6-core.js'
      - 'discovery-catalogue.json'
      - 'discovery-themes.json'
      - 'discovery-themes-wide.json'
      - 'category-universe.json'
      - 'category-radar.html'
      - 'organic-rising-config.json'
      - 'discovery-engine.js'
      - 'discovery-history.js'
      - 'review-intelligence.js'
      - 'market-intelligence.html'
      - 'watchlist.html'
      - 'test-buy.html'
      - 'free-readiness.html'
      - 'alerts.html'
      - 'validation-queue.html'
      - 'data-confidence.html'
      - 'free-intelligence-ui.js'
      - 'commercial-observations.json'
      - '.deploy-trigger'
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 9 * * *'
    - cron: '30 15 * * *'
    - cron: '30 21 * * *'

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout radar
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Radar V2 + Wide Product Discovery + Organic Rising scan
        id: scan
        continue-on-error: true
        run: node scripts/run-github-scan.mjs
      - name: Enrich real product preview images
        if: always()
        continue-on-error: true
        run: node scripts/enrich-discovery-images.mjs
      - name: Build strict Market Intelligence dataset
        if: always()
        run: node scripts/market-intelligence-postprocess.mjs
      - name: Build Golden Product Pipeline pre-paid funnel
        if: always()
        run: node scripts/golden-product-pipeline.mjs --phase=prepaid
      - name: Enrich Romania keyword demand with DataForSEO when configured
        if: always()
        continue-on-error: true
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node scripts/dataforseo-keywords.mjs
      - name: Update Market Intelligence history
        if: always()
        run: node scripts/market-intelligence-history.mjs
      - name: Build free Trend Intelligence
        if: always()
        run: node scripts/market-trend-postprocess.mjs
      - name: Build Opportunity Ranking V2
        if: always()
        run: node scripts/opportunity-ranking-v2.mjs
      - name: Build Full Free Intelligence Suite
        if: always()
        run: node scripts/free-intelligence-suite.mjs
      - name: Build verified commercial intelligence
        if: always()
        run: node scripts/commercial-hardening.mjs
      - name: Build V2.5 intelligence ecosystem
        if: always()
        run: node scripts/intelligence-ecosystem-v25.mjs
      - name: Build V2.6 Romania Demand Sales and Reverse Keyword intelligence
        if: always()
        continue-on-error: true
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          DATAFORSEO_V26_PAID_ENABLED: ${{ vars.DATAFORSEO_V26_PAID_ENABLED }}
          V26_DEEP_PRODUCTS: '5'
          V26_MAX_PAID_CALLS: '5'
          V26_MAX_RUN_COST_USD: '0.50'
        run: node scripts/provider-intelligence-v26.mjs
      - name: Build strict Test Buy decision
        if: always()
        run: node scripts/test-buy-decision.mjs
      - name: Apply final verified commercial gates
        if: always()
        run: node scripts/commercial-final-decision.mjs
      - name: Finalize Golden Product Pipeline
        if: always()
        run: node scripts/golden-product-pipeline.mjs --phase=final
      - name: Build Category Radar
        if: always()
        run: node scripts/category-radar-postprocess.mjs
      - name: Build Smart Opportunity Watchlist
        if: always()
        run: node scripts/watchlist-postprocess.mjs
      - name: Audit Free Readiness
        if: always()
        run: node scripts/free-readiness-audit.mjs
      - name: Validate Organic Rising data
        if: always()
        run: node scripts/qa-organic-rising.mjs
      - name: Persist radar, discovery, organic and intelligence histories and scan status
        if: always()
        run: |
          set -e
          mkdir -p /tmp/radar-output
          for f in radar-live.json radar-history.json discovery-live.json discovery-history.json organic-rising-live.json organic-rising-history.json market-intelligence-live.json market-intelligence-history.json intelligence-ecosystem-live.json provider-intelligence-live.json provider-intelligence-cache.json watchlist-live.json alerts-live.json validation-queue-live.json data-confidence-live.json category-radar-live.json free-readiness-live.json golden-pipeline-live.json dataforseo-cache.json paid-budget-live.json commercial-hardening-live.json commercial-observations.json scan-status.json; do
            if [ -f "$f" ]; then cp "$f" "/tmp/radar-output/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in /tmp/radar-output/*.json; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            cp "$f" "$base"
            git add -- "$base"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update Mega Product Radar V2 scan"
            git push origin main
          else
            echo "No radar data changes to commit."
          fi
      - name: Validate current Radar V2 site
        if: always()
        run: |
          node scripts/build-site.mjs
          node scripts/qa-mobile.mjs
      - name: Explain Pages publishing
        if: always()
        run: echo "GitHub Pages publishes the committed root automatically."
