name: Amazon Live Observation Persistence V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260831_amazon_live_observation_persistence_v1.sql'
      - 'supabase/migrations/20260831_amazon_live_observation_url_fix_v1.sql'
      - '.github/workflows/amazon-live-observation-persistence-v1.yml'
      - 'amazon-live-catalog.json'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260831_amazon_live_observation_persistence_v1.sql'
      - 'supabase/migrations/20260831_amazon_live_observation_url_fix_v1.sql'
      - '.github/workflows/amazon-live-observation-persistence-v1.yml'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned live catalog contract
        run: |
          test "$(git hash-object amazon-live-catalog.json)" = "b3b97975dbf8e953f8286037d0ba2c52a68f9442"
          jq -e '.schema == "MPR_AMAZON_LIVE_CATALOG_BRIDGE_V1"' amazon-live-catalog.json >/dev/null
          jq -e '.stats.exactAsinJoins == 290 and (.products|length) == 290' amazon-live-catalog.json >/dev/null
          jq -e '.truthPolicy.providerSpendEur == 0 and .truthPolicy.paidCallsTriggered == 0 and .truthPolicy.purchaseAuthorized == false' amazon-live-catalog.json >/dev/null
          jq -e 'all(.products[]; .evidenceClass == "LIVE_PUBLIC_PRODUCT_PAGE" and .salesEvidenceClass == "NOT_VERIFIED_SALES" and .purchaseAuthorized == false)' amazon-live-catalog.json >/dev/null
          test "$(jq -r '.products[].externalId' amazon-live-catalog.json | sort | uniq | wc -l)" -eq 290

  persist:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mint scoped GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN_JSON="$(curl --fail-with-body -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mpr-amazon-live-observations")"
          echo "token=$(jq -r '.value' <<<"$TOKEN_JSON")" >> "$GITHUB_OUTPUT"
      - name: Persist exact-ASIN live observations
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          jq -n \
            --arg expectedSha "$GITHUB_SHA" \
            --arg catalogBlobSha "b3b97975dbf8e953f8286037d0ba2c52a68f9442" \
            --slurpfile catalog amazon-live-catalog.json \
            '{expectedSha:$expectedSha,catalogBlobSha:$catalogBlobSha,schema:$catalog[0].schema,rows:$catalog[0].products,policy:{providerSpendEur:0,paidCallsTriggered:0,purchaseAuthorized:false,verifiedSales:false}}' > /tmp/payload.json
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json \
            "https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/github-oidc-amazon-live-observations-v1" \
            | tee amazon-live-observation-receipt.json
          jq -e '.ok == true and .schema == "MPR_AMAZON_LIVE_OBSERVATION_OIDC_RECEIPT_V1"' amazon-live-observation-receipt.json >/dev/null
          jq -e '.receipt.ok == true and .receipt.inputRows == 290 and .receipt.matchedExactAsin == 290' amazon-live-observation-receipt.json >/dev/null
          jq -e '.receipt.providerSpendEur == 0 and .receipt.paidCallsTriggered == 0 and .receipt.purchaseAuthorized == false and .receipt.verifiedSales == false' amazon-live-observation-receipt.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: amazon-live-observation-receipt-${{ github.sha }}
          path: amazon-live-observation-receipt.json
          retention-days: 30
          if-no-files-found: error
