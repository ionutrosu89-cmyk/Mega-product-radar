name: G2 Canonical Bootstrap R1

on:
  push:
    branches: [main]
    paths:
      - '.g2-canonical-bootstrap-r1-trigger'

permissions:
  contents: read
  id-token: write

env:
  MPR_CANONICAL_BOOTSTRAP_IMPORT_APPROVED: 'true'
  MPR_CANONICAL_BOOTSTRAP_AUDIENCE: 'mpr-amazon-canonical-bootstrap'
  MPR_CANONICAL_BOOTSTRAP_URL: 'https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/github-oidc-amazon-canonical-bootstrap-v1'

jobs:
  canonical-bootstrap-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact dataset digest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/real-products-1000.compact.json','utf8'));
          if(d.schemaVersion!=='MPR_REAL_PRODUCT_BOOTSTRAP_1000_V1') process.exit(1);
          if(d.uniqueProductCount!==1000) process.exit(2);
          if(d.productSetSha256!=='d555b25edcd604f29cca36d0f3651026349f332d1931569f809ec95c6cb4afb6') process.exit(3);
          NODE
      - name: Dry-run local import plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/import-canonical-bootstrap-to-supabase.mjs --batch=250 | tee canonical-bootstrap-dry-run.txt
      - name: Execute exact-source bootstrap via GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo 'GITHUB_OIDC_REQUEST_URL_REQUIRED'; exit 10; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo 'GITHUB_OIDC_REQUEST_TOKEN_REQUIRED'; exit 11; }
          OIDC_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${MPR_CANONICAL_BOOTSTRAP_AUDIENCE}")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -er '.value')"
          REQUEST_BODY="$(jq -nc --arg sha "$GITHUB_SHA" '{action:"bootstrap",expectedSha:$sha}')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$REQUEST_BODY" \
            "$MPR_CANONICAL_BOOTSTRAP_URL" | tee canonical-bootstrap-result.json
          jq -e '.ok == true and .inputCount == 1000 and .resolvedCount == 1000 and .rejectedCount == 0 and .policy.providerSpendEur == 0 and .policy.paidCallsTriggered == 0 and .policy.purchaseAuthorized == false' canonical-bootstrap-result.json >/dev/null
      - name: Preserve bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-canonical-bootstrap-r1-${{ github.sha }}
          path: |
            canonical-bootstrap-dry-run.txt
            canonical-bootstrap-result.json
          if-no-files-found: warn
          retention-days: 30
