name: Romania Refresh Consumer V1

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.romania-refresh-consumer-trigger'

permissions:
  contents: read
  id-token: write

env:
  MPR_ROMANIA_REFRESH_AUDIENCE: 'mpr-romania-refresh-consumer'
  MPR_ROMANIA_REFRESH_URL: 'https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/romania-refresh-consumer-v1'
  MPR_ROMANIA_REFRESH_LIMIT: '6'
  MPR_ROMANIA_REFRESH_RECEIPT: 'artifacts/romania-refresh-consumer-v1.json'

concurrency:
  group: romania-refresh-consumer-v1
  cancel-in-progress: false

jobs:
  consume-romania-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mint GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo 'GITHUB_OIDC_REQUEST_URL_REQUIRED'; exit 10; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo 'GITHUB_OIDC_REQUEST_TOKEN_REQUIRED'; exit 11; }
          OIDC_JSON="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${MPR_ROMANIA_REFRESH_AUDIENCE}")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -er '.value')"
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> "$GITHUB_ENV"
      - name: Consume bounded Romania refresh batch
        run: node scripts/run-romania-refresh-consumer-v1.mjs
      - name: Verify fail-closed receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schemaVersion == "MPR_ROMANIA_REFRESH_CONSUMER_RECEIPT_V1" and .claimed <= 6 and .policy.providerSpendEur == 0 and .policy.paidCallsTriggered == 0 and .policy.purchaseAuthorized == false and .policy.salesEvidenceClass == "NOT_VERIFIED_SALES"' "$MPR_ROMANIA_REFRESH_RECEIPT" >/dev/null
      - name: Preserve Romania refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: romania-refresh-consumer-v1-${{ github.run_id }}
          path: artifacts/romania-refresh-consumer-v1.json
          if-no-files-found: warn
          retention-days: 30
