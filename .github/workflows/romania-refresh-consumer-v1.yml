name: Romania Refresh Consumer V1

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.romania-refresh-consumer-trigger'
      - '.github/workflows/romania-refresh-consumer-v1.yml'
  pull_request:
    paths:
      - '.github/workflows/romania-refresh-consumer-v1.yml'
      - 'scripts/run-romania-refresh-consumer-v1.mjs'
      - 'supabase/migrations/20260831_romania_scale_10000_membership_and_refresh_queue_v1.sql'
      - 'supabase/migrations/20260901_romania_refresh_conflict_target_ambiguity_fix.sql'

permissions:
  contents: read
  id-token: write

env:
  MPR_ROMANIA_REFRESH_AUDIENCE: 'mpr-romania-refresh-consumer'
  MPR_ROMANIA_REFRESH_URL: 'https://xqzsbebbuovcyeyxdqxo.supabase.co/functions/v1/romania-refresh-consumer-v1'
  MPR_ROMANIA_EDGE_BATCH_LIMIT: '8'
  MPR_ROMANIA_EDGE_BATCH_ROUNDS: '4'
  MPR_ROMANIA_JWT_CLOCK_SKEW_RETRY_SECONDS: '5'
  MPR_ROMANIA_TRANSIENT_NETWORK_RETRY_SECONDS: '3'

concurrency:
  group: romania-refresh-consumer-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consume-romania-refresh:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo 'GITHUB_OIDC_REQUEST_URL_REQUIRED'; exit 10; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo 'GITHUB_OIDC_REQUEST_TOKEN_REQUIRED'; exit 11; }
          OIDC_JSON="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${MPR_ROMANIA_REFRESH_AUDIENCE}")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -er '.value')"
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> "$GITHUB_ENV"
      - name: Consume Romania hydration through Supabase Edge egress
        shell: bash
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/edge-batches.ndjson
          for round in $(seq 1 "$MPR_ROMANIA_EDGE_BATCH_ROUNDS"); do
            worker_id="w${WORKER}-r${round}"
            jq -n --arg action collectBatch --arg workerId "$worker_id" --argjson limit "$MPR_ROMANIA_EDGE_BATCH_LIMIT" '{action:$action,workerId:$workerId,limit:$limit}' > request.json
            cp request.json "artifacts/edge-request-${worker_id}.json"

            # Preserve the Edge response and HTTP status even when curl fails.
            # The request remains strictly fail-closed. Permit only bounded retries
            # for observed transient GitHub/Supabase clock skew or transport errors.
            # Business/HTTP contract failures are never retried into success.
            attempt=1
            while true; do
              rm -f batch.json
              set +e
              http_status="$(curl --fail-with-body --silent --show-error --max-time 120 \
                -X POST "$MPR_ROMANIA_REFRESH_URL" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H 'content-type: application/json' \
                --data-binary @request.json \
                -o batch.json \
                -w '%{http_code}')"
              curl_rc=$?
              set -e

              printf '%s\n' "$http_status" > "artifacts/edge-http-status-${worker_id}-attempt-${attempt}.txt"
              if [ -f batch.json ]; then
                cp batch.json "artifacts/edge-response-${worker_id}-attempt-${attempt}.json"
              fi

              if [ "$curl_rc" -eq 0 ]; then
                break
              fi

              if [ "$attempt" -lt 3 ] && [ -s batch.json ] && grep -Fq 'JWT issued at future' batch.json; then
                echo "EDGE_TRANSIENT_JWT_CLOCK_SKEW worker=${WORKER} round=${round}; retrying after ${MPR_ROMANIA_JWT_CLOCK_SKEW_RETRY_SECONDS}s" >&2
                sleep "$MPR_ROMANIA_JWT_CLOCK_SKEW_RETRY_SECONDS"
                attempt=$((attempt+1))
                continue
              fi

              if [ "$attempt" -lt 3 ] && [[ "$curl_rc" =~ ^(7|18|28|52|55|56|92)$ ]]; then
                echo "EDGE_TRANSIENT_NETWORK_ERROR worker=${WORKER} round=${round} curl_rc=${curl_rc}; retrying after ${MPR_ROMANIA_TRANSIENT_NETWORK_RETRY_SECONDS}s" >&2
                sleep "$MPR_ROMANIA_TRANSIENT_NETWORK_RETRY_SECONDS"
                attempt=$((attempt+1))
                continue
              fi

              echo "EDGE_REQUEST_FAILED worker=${WORKER} round=${round} attempt=${attempt} curl_rc=${curl_rc} http_status=${http_status}" >&2
              if [ -s batch.json ]; then
                cat batch.json >&2
              fi
              exit "$curl_rc"
            done

            cp "artifacts/edge-http-status-${worker_id}-attempt-${attempt}.txt" "artifacts/edge-http-status-${worker_id}.txt"
            cp "artifacts/edge-response-${worker_id}-attempt-${attempt}.json" "artifacts/edge-response-${worker_id}.json"

            jq -e '
              .ok == true and
              .schemaVersion == "MPR_ROMANIA_EDGE_HYDRATION_BATCH_V1" and
              .claimed <= 8 and
              .policy.providerSpendEur == 0 and
              .policy.paidCallsTriggered == 0 and
              .policy.purchaseAuthorized == false and
              .policy.salesEvidenceClass == "NOT_VERIFIED_SALES" and
              .policy.comparabilityPromoted == false and
              .policy.missingAsZero == false
            ' batch.json >/dev/null
            jq -c . batch.json >> artifacts/edge-batches.ndjson
            completed="$(jq -r '.completed' batch.json)"
            claimed="$(jq -r '.claimed' batch.json)"
            echo "worker=${WORKER} round=${round} claimed=${claimed} completed=${completed}"
            if [ "$claimed" = "0" ]; then break; fi
          done
          jq -s '{schemaVersion:"MPR_ROMANIA_EDGE_HYDRATION_WORKER_RECEIPT_V1",batches:.,claimed:(map(.claimed)|add//0),completed:(map(.completed)|add//0),deferred:(map(.deferred)|add//0),failed:(map(.failed)|add//0),policy:{providerSpendEur:0,paidCallsTriggered:0,purchaseAuthorized:false,salesEvidenceClass:"NOT_VERIFIED_SALES",comparabilityPromoted:false,missingAsZero:false}}' artifacts/edge-batches.ndjson > "artifacts/romania-edge-worker-${WORKER}.json"
          jq . "artifacts/romania-edge-worker-${WORKER}.json"
      - name: Preserve Romania Edge hydration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: romania-edge-hydration-${{ github.run_id }}-worker-${{ matrix.worker }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  validate-romania-refresh-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded zero-cost Edge hydration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MPR_ROMANIA_EDGE_BATCH_LIMIT: '8'" .github/workflows/romania-refresh-consumer-v1.yml
          grep -q "MPR_ROMANIA_EDGE_BATCH_ROUNDS: '4'" .github/workflows/romania-refresh-consumer-v1.yml
          grep -q "MPR_ROMANIA_JWT_CLOCK_SKEW_RETRY_SECONDS: '5'" .github/workflows/romania-refresh-consumer-v1.yml
          grep -q "MPR_ROMANIA_TRANSIENT_NETWORK_RETRY_SECONDS: '3'" .github/workflows/romania-refresh-consumer-v1.yml
          grep -q 'worker: \[0, 1, 2, 3, 4, 5, 6, 7\]' .github/workflows/romania-refresh-consumer-v1.yml
          grep -q 'collectBatch' .github/workflows/romania-refresh-consumer-v1.yml
          grep -q 'JWT issued at future' .github/workflows/romania-refresh-consumer-v1.yml
          grep -q 'attempt=$((attempt+1))' .github/workflows/romania-refresh-consumer-v1.yml
          grep -q 'EDGE_TRANSIENT_NETWORK_ERROR' .github/workflows/romania-refresh-consumer-v1.yml
          grep -q 'edge-http-status-' .github/workflows/romania-refresh-consumer-v1.yml
          grep -q 'edge-response-' .github/workflows/romania-refresh-consumer-v1.yml
          grep -q 'comparabilityPromoted == false' .github/workflows/romania-refresh-consumer-v1.yml
          grep -q 'missingAsZero == false' .github/workflows/romania-refresh-consumer-v1.yml
          grep -q "ROMANIA_10K_HYDRATION_EMAG_V1" supabase/migrations/20260831_romania_scale_10000_membership_and_refresh_queue_v1.sql
          ! grep -Eqi 'paid_calls_allowed[^f]*true|purchase_authorized[^f]*true' supabase/migrations/20260831_romania_scale_10000_membership_and_refresh_queue_v1.sql
          grep -q 'evidence_surface text;' supabase/migrations/20260901_romania_refresh_conflict_target_ambiguity_fix.sql
          grep -q 'evidence_observed_at timestamptz;' supabase/migrations/20260901_romania_refresh_conflict_target_ambiguity_fix.sql
          ! grep -Eq '(^|[[:space:]])surface text;' supabase/migrations/20260901_romania_refresh_conflict_target_ambiguity_fix.sql
          ! grep -Eq '(^|[[:space:]])observed_at timestamptz;' supabase/migrations/20260901_romania_refresh_conflict_target_ambiguity_fix.sql
          grep -q "'NOT_VERIFIED_SALES'" supabase/migrations/20260901_romania_refresh_conflict_target_ambiguity_fix.sql
          grep -q "'purchaseAuthorized',false" supabase/migrations/20260901_romania_refresh_conflict_target_ambiguity_fix.sql
          grep -q "'providerSpendEur',0" supabase/migrations/20260901_romania_refresh_conflict_target_ambiguity_fix.sql
