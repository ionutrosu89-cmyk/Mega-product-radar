<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Mega Product Radar</title>
  <style>
    *{box-sizing:border-box}:root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--navy:#08111f;--green:#067647;--red:#b42318;--amber:#b54708}body{margin:0;background:#f4f6f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}header{color:#fff;background:linear-gradient(135deg,#08111f,#17365f);padding:calc(18px + env(safe-area-inset-top)) 16px 18px}.head,main{max-width:1080px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:21px;margin:0}.tag{font-size:12px;color:#b9c7db;margin-top:4px}.scan{border:0;background:#32d583;color:#052e1d;border-radius:12px;padding:12px 16px;min-height:44px;font-weight:900;white-space:nowrap}.scan:disabled{opacity:.55}.status{max-width:1080px;margin:12px auto 0;padding:12px;background:#101d30;border:1px solid #31425b;border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status span{display:block;color:#9fb0c8;font-size:10px;text-transform:uppercase}.status b{font-size:12px}.error{color:#fda29b!important}main{padding:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi,.card,.empty{background:#fff;border:1px solid var(--line);border-radius:16px}.kpi{padding:12px}.kpi b{display:block;font-size:21px}.kpi small{color:var(--muted)}.tools{display:grid;grid-template-columns:1fr 150px;gap:8px;margin:12px 0}input,select{min-height:44px;width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:10px;font:inherit;background:#fff}.grid{display:grid;gap:10px}.card{padding:14px}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:900;line-height:1.3}.pill{display:inline-block;border-radius:999px;background:#eef4ff;color:#3538cd;font-size:10px;font-weight:900;padding:5px 8px;margin-top:7px}.score{min-width:62px;text-align:center;border-radius:12px;background:#ecfdf3;color:var(--green);font-size:17px;font-weight:900;padding:9px 5px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.metric{background:#f8fafc;border-radius:10px;padding:8px;min-width:0}.metric small{display:block;color:var(--muted);font-size:9px}.metric b{font-size:12px;overflow-wrap:anywhere}.evidence{border-top:1px solid var(--line);margin-top:11px;padding-top:10px;color:#475467;font-size:12px;line-height:1.5}.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.links a{color:#175cd3;font-size:12px;font-weight:800}.empty{padding:25px;text-align:center;color:var(--muted)}@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(4,1fr)}}@media(max-width:480px){.head{align-items:flex-start}.tag{max-width:210px}.status{margin:10px 12px 0;grid-template-columns:1fr 1fr}.status>div:last-child{grid-column:1/-1}.tools{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header>
    <div class="head"><div><h1>Mega Product Radar</h1><div class="tag">Scan AI automat zilnic • fără Netlify • România → profit</div></div><button id="runScan" class="scan" type="button">Refresh</button></div>
    <div class="status" aria-live="polite"><div><span>Data source</span><b id="dataSource">Se încarcă…</b></div><div><span>Last scan</span><b id="lastScan">—</b></div><div><span>Scan status</span><b id="scanStatus">Se verifică…</b><b id="scanError" class="error"></b></div></div>
  </header>
  <main>
    <div class="kpis"><div class="kpi"><b id="total">0</b><small>produse</small></div><div class="kpi"><b id="buyCount">0</b><small>Buy Zone</small></div><div class="kpi"><b id="avgScore">—</b><small>scor mediu</small></div></div>
    <div class="tools"><input id="search" type="search" placeholder="Caută produs sau categorie…" aria-label="Caută produse"><select id="category" aria-label="Categorie"><option value="">Toate categoriile</option></select></div>
    <div id="products" class="grid"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
