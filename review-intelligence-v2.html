<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Review Intelligence V2 — Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css"><style>
body{margin:0;background:#07111f;color:#f5f7fb;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}.shell{max-width:1020px;margin:auto;padding:16px}.muted{color:#9db0c9}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0 18px}.chip,.card,.kpi{border:1px solid #22344c;background:#0d1b2d;border-radius:16px}.chip{padding:9px 12px;color:inherit;text-decoration:none;white-space:nowrap}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{padding:13px}.kpi b{display:block;font-size:23px}.grid{display:grid;gap:10px;margin-top:14px}.card{padding:14px}.top{display:flex;justify-content:space-between;gap:12px}.name{font-size:16px;font-weight:800}.score{font-size:18px;font-weight:850}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.badge{border:1px solid #334862;border-radius:999px;padding:4px 7px;font-size:11px}.good{color:#35d07f}.warn{color:#ffbf4b}.bad{color:#ff7a7a}.themes{display:grid;gap:6px;margin-top:10px}.theme{padding:9px 10px;background:#091727;border-radius:11px}.ideas{margin-top:10px;padding-top:10px;border-top:1px solid #22344c}.idea{font-size:12px;color:#c4d0df;margin-top:5px}.foot{font-size:11px;color:#71859f;margin-top:18px}@media(max-width:680px){.kpis{grid-template-columns:repeat(2,1fr)}.shell{padding:13px}}
</style></head><body><main class="shell"><div class="muted">Mega Product Radar · gratuit</div><h1>Review Intelligence V2</h1><p class="muted">Transformă doar dovezile de review deja colectate în teme recurente și idei de îmbunătățire. Nu inventează sentiment, review-uri sau probleme.</p><nav class="nav"><a class="chip" href="action-center.html">Ce fac azi?</a><a class="chip" href="market-intelligence.html">Market Intelligence</a><a class="chip" href="supplier-intelligence.html">Supplier Intelligence</a><a class="chip" href="validation-queue.html">Validation Queue</a></nav><section id="kpis" class="kpis"></section><section id="grid" class="grid"></section><div id="foot" class="foot"></div></main><script type="module">
import{roProductName,roCategory}from'./product-ro.js';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const confClass=x=>x==='RIDICATĂ'?'good':x==='MEDIE'?'warn':'bad';fetch('./market-intelligence-live.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const items=(d.products||[]).map(p=>({p,r:p.reviewIntelligenceV2||{}})).sort((a,b)=>(b.r.coverageScore||0)-(a.r.coverageScore||0));const withEvidence=items.filter(x=>(x.r.sourceCount||0)>0);const high=items.filter(x=>x.r.confidence==='RIDICATĂ').length;const themes=items.reduce((a,x)=>a+(x.r.negativeThemes?.length||0),0);$('#kpis').innerHTML=[[items.length,'produse analizate'],[withEvidence.length,'cu dovezi review'],[high,'încredere ridicată'],[themes,'teme observate']].map(([v,l])=>`<div class="kpi"><b>${v}</b><span class="muted">${l}</span></div>`).join('');$('#grid').innerHTML=items.slice(0,50).map(({p,r})=>`<article class="card"><div class="top"><div><div class="name">${esc(roProductName(p.name))}</div><div class="muted">${esc(roCategory(p.cat))} · ${r.sourceCount||0} surse · ${r.snippetCount||0} fragmente</div></div><div class="score ${confClass(r.confidence)}">${r.coverageScore||0}</div></div><div class="badges"><span class="badge ${confClass(r.confidence)}">Încredere ${esc(r.confidence||'SCĂZUTĂ')}</span><span class="badge">Coverage ${r.coverageScore||0}</span></div><div class="themes">${(r.negativeThemes||[]).length?(r.negativeThemes||[]).map(t=>`<div class="theme">⚠ ${esc(t)}</div>`).join(''):'<div class="theme muted">Nu există încă o temă negativă susținută de dovezi.</div>'}</div><div class="ideas"><b>Idei de diferențiere</b>${(r.improvementIdeas||[]).length?(r.improvementIdeas||[]).map(x=>`<div class="idea">→ ${esc(x)}</div>`).join(''):'<div class="idea muted">Așteaptă mai multe dovezi înainte de a deduce o direcție de produs.</div>'}</div></article>`).join('');$('#foot').textContent=`Actualizat: ${d.updatedAt?new Date(d.updatedAt).toLocaleString('ro-RO'):'—'} · Review Intelligence V2 nu modifică pragurile TEST/CUMPĂRĂ.`}).catch(()=>$('#grid').innerHTML='<div class="card">Datele Review Intelligence V2 nu sunt disponibile încă.</div>');
</script></body></html>
