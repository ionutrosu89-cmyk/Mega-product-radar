[build]
  publish = "."
  functions = "."

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/products.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
