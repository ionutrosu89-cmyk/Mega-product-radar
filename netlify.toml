[build]
  ignore = "exit 0"
  command = "npm run build"
  publish = "_site"

# Public root serves the commercial customer landing while legacy/internal pages remain addressable directly.
[[redirects]]
  from = "/"
  to = "/beta.html"
  status = 200
  force = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["discovery-live.json", "organic-rising-live.json"]

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
