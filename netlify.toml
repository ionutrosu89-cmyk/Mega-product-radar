[build]
  ignore = "exit 0"
  command = "npm run build"
  publish = "_site"

# Mega Product Radar 6.0 runs operationally from GitHub Pages + GitHub Actions.
# Netlify builds are intentionally ignored so the app does not depend on Netlify credits.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
