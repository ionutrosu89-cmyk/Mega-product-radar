<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Category Radar — Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css"><style>:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#22344c;--text:#f5f7fb;--muted:#9db0c9;--good:#35d07f;--warn:#ffbf4b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0a1423 48%,#07111f);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}.shell{width:min(1120px,100%);margin:auto;padding:16px}.eyebrow{color:#77aefb;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.title{font-size:clamp(30px,8vw,48px);margin:5px 0}.muted{color:var(--muted)}.nav{display:flex;gap:8px;overflow:auto;margin:14px 0}.chip,.catBtn{border:1px solid var(--line);background:#0b1929;border-radius:999px;padding:8px 11px;text-decoration:none;color:inherit;white-space:nowrap}.summary,.panel,.card{border:1px solid var(--line);background:rgba(13,27,45,.92);border-radius:18px}.summary{padding:15px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#091727;border-radius:12px;padding:11px}.kpi small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.kpi b{font-size:22px}.cats{display:flex;gap:7px;overflow:auto;padding:12px 0}.catBtn.active{border-color:#77aefb}.panel{padding:14px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.card{padding:12px;background:#091727}.name{font-size:16px;font-weight:800}.meta{color:var(--muted);font-size:11px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:10px;margin-top:6px}.good{color:var(--good)}.warn{color:var(--warn)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.metric{background:#071421;border-radius:9px;padding:7px}.metric small{display:block;color:var(--muted);font-size:9px}.links{margin-top:8px}.links a{color:#9fc5ff}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:760px){.kpis,.cards{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:460px){.shell{padding:13px}.kpis,.cards{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="eyebrow">Mega Product Radar · Category First</div><h1 class="title">Category Radar</h1><div class="muted">Alege categoria care te interesează. Fiecare categorie are propriul Top 10–20 și propriile verdicturi comerciale; produsele nu mai concurează între categorii.</div><nav class="nav"><a class="chip" href="test-buy.html">Test Buy</a><a class="chip" href="market-intelligence.html">Market Intelligence</a><a class="chip" href="product-decision.html">Dosar produs</a><a class="chip" href="action-center.html">Ce fac azi?</a></nav><section class="summary" id="summary"></section><div class="cats" id="cats"></div><section class="panel" id="panel"></section></main><script type="module">import{roProductName}from'./product-ro.js';const $=s=>document.querySelector(s),num=v=>Number.isFinite(Number(v))?Number(v):0,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let data,active;function renderCats(){const cats=data.categories||[];$('#cats').innerHTML=cats.map(c=>`<button class="catBtn ${c.key===active?'active':''}" data-k="${esc(c.key)}">${esc(c.label)} · ${c.current}/${c.target}</button>`).join('');document.querySelectorAll('.catBtn').forEach(b=>b.onclick=()=>{active=b.dataset.k;renderCats();renderPanel()})}function card(p){const ready=p.testStatus==='TEST_BUY';return `<article class="card"><div class="name">#${p.rank} ${esc(roProductName(p.name))}</div><div class="meta">Opportunity #${p.opportunityRank||'—'} · Confidence ${num(p.confidenceScore)}</div><span class="badge ${ready?'good':'warn'}">${esc(p.verdict)}</span><div class="metrics"><div class="metric"><small>Gate-uri</small><b>${p.gates?.passed||0}/${p.gates?.total||8}</b></div><div class="metric"><small>Marjă</small><b>${num(p.margin).toFixed(1)}%</b></div><div class="metric"><small>ROI</small><b>${num(p.roi).toFixed(1)}%</b></div><div class="metric"><small>Profit/u</small><b>${num(p.profit).toFixed(1)} lei</b></div></div><div class="links"><a href="product-decision.html?product=${encodeURIComponent(p.name)}">Deschide dosarul →</a></div></article>`}function renderPanel(){const c=(data.categories||[]).find(x=>x.key===active);if(!c){$('#panel').innerHTML='<div class="empty">Alege o categorie.</div>';return}$('#panel').innerHTML=`<div class="head"><div><h2>${esc(c.label)}</h2><div class="muted">${c.current}/${c.target} produse · minimum afișare ${c.minimum} · coverage ${c.coveragePct}%</div></div><div><b class="${c.ready?'good':'warn'}">${c.ready} TEST-ready</b></div></div>${c.products?.length?`<div class="cards">${c.products.map(card).join('')}</div>`:`<div class="empty">Categoria este în curs de populare. Scannerul o prioritizează automat dacă este sub țintă.</div>`}`}fetch('./category-radar-live.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{data=d;const s=d.stats||{};$('#summary').innerHTML=`<div class="kpis"><div class="kpi"><small>Categorii</small><b>${num(s.categories)}</b></div><div class="kpi"><small>Cu min. 10</small><b>${num(s.categoriesAtMinimum)}</b></div><div class="kpi"><small>Țintă/categorie</small><b>${num(s.minimumPerCategory)}–${num(s.targetPerCategory)}</b></div><div class="kpi"><small>TEST-ready total</small><b>${num(s.totalTestReady)}</b></div></div>`;active=d.categories?.[0]?.key;renderCats();renderPanel()}).catch(()=>{$('#summary').innerHTML='<div class="empty">Category Radar va fi disponibil după următoarea scanare.</div>'});</script></body></html>
