<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Validation Queue — Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css"><style>body{margin:0;background:#07111f;color:#f5f7fb;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}.shell{max-width:980px;margin:auto;padding:18px}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0 18px}.chip,.card,.kpi{border:1px solid #22344c;background:#0d1b2d;border-radius:16px}.chip{padding:9px 12px;color:inherit;text-decoration:none;white-space:nowrap}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{padding:12px}.kpi b{display:block;font-size:22px}.muted{color:#9db0c9}.grid{display:grid;gap:10px;margin-top:14px}.card{padding:14px}.name{font-weight:760;font-size:16px}.tasks{display:grid;gap:7px;margin-top:10px}.task{display:flex;justify-content:space-between;gap:8px;background:#091727;border-radius:10px;padding:9px}.priority{color:#ffcb66;font-weight:700}.blockers{margin-top:9px;color:#c3d0df;font-size:12px}@media(max-width:650px){.kpis{grid-template-columns:repeat(2,1fr)}.shell{padding:14px}}</style></head><body><main class="shell"><div class="muted">Mega Product Radar · gratuit</div><h1>Validation Queue</h1><div class="muted">Ce trebuie verificat ca un produs să poată avansa spre o decizie mai solidă.</div><nav class="nav"><a class="chip" href="validation-workflow-v2.html">Workflow V2</a><a class="chip" href="alerts.html">Alerte</a><a class="chip" href="watchlist.html">Top Opportunities</a><a class="chip" href="data-confidence.html">Data Confidence</a><a class="chip" href="market-intelligence.html">Market Intelligence</a></nav><section class="kpis"><div class="kpi"><b id="total">—</b><span class="muted">produse</span></div><div class="kpi"><b id="pricing">—</b><span class="muted">pricing</span></div><div class="kpi"><b id="sourcing">—</b><span class="muted">sourcing</span></div><div class="kpi"><b id="competition">—</b><span class="muted">competiție RO</span></div></section><section id="grid" class="grid"></section></main><script type="module">import{roProductName}from'./product-ro.js';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('./validation-queue-live.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{for(const k of['total','pricing','sourcing','competition'])document.getElementById(k).textContent=k==='total'?(d.stats?.products??0):(d.stats?.[k]??0);grid.innerHTML=(d.items||[]).map(x=>`<article class="card"><div class="name">#${x.rank||'—'} · ${esc(roProductName(x.name))}</div><div class="muted">Opportunity ${x.opportunityScore||0} · ${esc(x.tier||'')} · Încredere ${esc(x.confidence||'SCĂZUTĂ')}</div><div class="tasks">${(x.tasks||[]).map(t=>`<div class="task"><span>${esc(t.label)}</span><span class="priority">P${t.priority}</span></div>`).join('')}</div>${(x.blockers||[]).length?`<div class="blockers">Blocaje: ${esc(x.blockers.slice(0,4).join(' · '))}</div>`:''}</article>`).join('')||'<div class="card">Coada este goală.</div>';}).catch(()=>grid.innerHTML='<div class="card">Datele de validare nu sunt disponibile încă.</div>');</script></body></html>
