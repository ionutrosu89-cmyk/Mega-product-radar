<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Alert Center — Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css"><style>body{margin:0;background:#07111f;color:#f5f7fb;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}.shell{max-width:980px;margin:auto;padding:18px}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0 18px}.chip,.card,.kpi{border:1px solid #22344c;background:#0d1b2d;border-radius:16px}.chip{padding:9px 12px;color:inherit;text-decoration:none;white-space:nowrap}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{padding:14px}.kpi b{display:block;font-size:24px}.muted{color:#9db0c9}.grid{display:grid;gap:10px;margin-top:14px}.card{padding:14px}.top{display:flex;gap:10px;align-items:center}.rank{font-size:22px;font-weight:800}.name{font-weight:750;font-size:16px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.badge{border:1px solid #334862;border-radius:999px;padding:4px 7px;font-size:11px}.high{color:#ff8080}.medium{color:#ffcb66}.low{color:#8bbcff}@media(max-width:650px){.shell{padding:14px}}</style></head><body><main class="shell"><div class="muted">Mega Product Radar · gratuit</div><h1>Alert Center</h1><div class="muted">Ce s-a schimbat și ce merită atenție acum. Alertele nu schimbă verdictul TEST/CUMPĂRĂ.</div><nav class="nav"><a class="chip" href="watchlist.html">Top Opportunities</a><a class="chip" href="validation-queue.html">Validation Queue</a><a class="chip" href="data-confidence.html">Data Confidence</a><a class="chip" href="market-intelligence.html">Market Intelligence</a></nav><section class="kpis"><div class="kpi"><b id="total">—</b><span class="muted">produse cu alerte</span></div><div class="kpi"><b id="high">—</b><span class="muted">alerte prioritare</span></div></section><section id="grid" class="grid"></section></main><script type="module">import{roProductName}from'./product-ro.js';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('./alerts-live.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{total.textContent=d.stats?.products??0;high.textContent=d.stats?.high??0;grid.innerHTML=(d.items||[]).map(x=>`<article class="card"><div class="top"><div class="rank">#${x.rank||'—'}</div><div><div class="name">${esc(roProductName(x.name))}</div><div class="muted">Opportunity ${x.opportunityScore||0} · ${esc(x.tier||'')}</div></div></div><div class="badges">${(x.alerts||[]).map(a=>`<span class="badge ${String(a.severity||'').toLowerCase()}">${esc(a.message)}</span>`).join('')}</div><div class="muted" style="margin-top:9px">Încredere date: ${esc(x.confidence||'SCĂZUTĂ')}</div></article>`).join('')||'<div class="card">Nu există alerte active.</div>';}).catch(()=>grid.innerHTML='<div class="card">Datele de alertare nu sunt disponibile încă.</div>');</script></body></html>
