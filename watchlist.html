<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f">
<title>Top Opportunities — Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css">
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#22344c;--text:#f5f7fb;--muted:#9db0c9;--good:#35d07f;--warn:#ffbf4b;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0a1423 50%,#07111f);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}.shell{width:min(1040px,100%);margin:auto;padding:18px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#77aefb}.title{font-size:clamp(28px,7vw,44px);line-height:1.05;margin:5px 0}.sub,.muted{color:var(--muted)}.nav{display:flex;gap:8px;overflow:auto;padding:14px 0}.chip{border:1px solid var(--line);background:#0c1929;padding:9px 12px;border-radius:999px;white-space:nowrap;color:inherit;text-decoration:none}.chip.active{background:#173354}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}.kpi,.card{border:1px solid var(--line);background:rgba(13,27,45,.9);border-radius:18px}.kpi{padding:14px}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}.grid{display:grid;gap:12px}.card{padding:15px}.top{display:flex;gap:12px;align-items:flex-start}.rank{font-size:24px;font-weight:800;min-width:44px}.thumb{width:70px;height:70px;object-fit:cover;border:1px solid var(--line);border-radius:14px;background:#091727}.fallback{display:grid;place-items:center;font-size:10px;color:var(--muted)}.grow{flex:1;min-width:0}.name{font-size:17px;font-weight:760}.cat{font-size:12px;color:var(--muted)}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.badge{border:1px solid var(--line);background:#091727;border-radius:999px;padding:4px 7px;font-size:11px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.metric{background:#091727;border-radius:12px;padding:9px}.metric small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.metric b{font-size:16px}.reason{margin-top:10px;color:#c4d0df;font-size:12px}.action{margin-top:11px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0a1828;display:flex;justify-content:space-between;gap:10px}.action strong{font-size:12px}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.empty{padding:40px;text-align:center;color:var(--muted)}.foot{font-size:11px;color:#71859f;margin-top:18px}@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.shell{padding:13px}.rank{font-size:20px;min-width:35px}.thumb{width:60px;height:60px}}
</style></head><body><main class="shell"><div class="eyebrow">Mega Product Radar · Watchlist</div><h1 class="title">Top Opportunities</h1><div class="sub">Cele mai importante produse de urmărit acum, ordonate după prioritate, schimbare și calitatea dovezilor. Watchlist-ul nu schimbă verdictul TEST/CUMPĂRĂ.</div><nav class="nav"><a class="chip" href="radar-ro.html">Radar</a><a class="chip" href="discovery-inbox.html">Descoperire</a><a class="chip" href="organic-rising.html">Organic Rising</a><a class="chip" href="market-intelligence.html">Market Intelligence</a><a class="chip active" href="watchlist.html">Top Opportunities</a><a class="chip" href="action-center.html">Ce fac azi?</a><a class="chip" href="purchase-manager-ro.html">Achiziții</a></nav><section class="kpis" id="kpis"></section><section class="grid" id="grid"></section><div class="foot" id="foot"></div></main><script type="module">
import {roProductName,roCategory} from './product-ro.js';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cls=t=>t==='TOP OPORTUNITATE'||t==='URMĂREȘTE PRIORITAR'?'good':t==='PRIORITATE MICĂ'?'bad':'warn';const trendCls=t=>['ACCELERATING','RISING'].includes(t)?'good':['COOLING','DECLINING'].includes(t)?'bad':'warn';const trendLabel={ACCELERATING:'Accelerează',RISING:'În creștere',STABIL:'Stabil',COOLING:'Încetinește',DECLINING:'În scădere',INSUFICIENT:'Istoric insuficient'};const d=v=>{const n=Number(v||0);return `<span class="delta ${n>0?'up':n<0?'down':''}">${n>0?'+':''}${n}</span>`};function image(x){return x.imageUrl?`<img class="thumb" src="${esc(x.imageUrl)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;thumb fallback&quot;>Imagine<br>nevalidată</div>'">`:'<div class="thumb fallback">Imagine<br>nevalidată</div>'}function render(data){const s=data.stats||{};$('#kpis').innerHTML=[[s.total,'În watchlist'],[s.changed,'Schimbate'],[s.urgent,'Atenție ridicată'],[s.needsValidation,'Necesită validare']].map(([v,l])=>`<div class="kpi"><b>${v||0}</b><span>${l}</span></div>`).join('');const items=data.items||[];$('#grid').innerHTML=items.length?items.map(x=>`<article class="card"><div class="top"><div class="rank">#${x.rank||'—'}</div>${image(x)}<div class="grow"><div class="name">${esc(roProductName(x.name))}</div><div class="cat">${esc(roCategory(x.cat))}</div><div class="badges"><span class="badge ${cls(x.tier)}">${esc(x.tier)}</span><span class="badge ${trendCls(x.trend)}">${esc(trendLabel[x.trend]||x.trend)}</span><span class="badge">Urgency ${x.urgency}</span>${x.changed?'<span class="badge good">Schimbat față de scanarea anterioară</span>':'<span class="badge">Fără schimbare relevantă</span>'}</div></div></div><div class="metrics"><div class="metric"><small>Opportunity</small><b>${x.opportunityScore}</b></div><div class="metric"><small>Launch</small><b>${x.launchScore}</b></div><div class="metric"><small>Δ Launch</small><b>${d(x.delta?.launch)}</b></div><div class="metric"><small>Δ Cerere</small><b>${d(x.delta?.demand)}</b></div><div class="metric"><small>Δ Gap</small><b>${d(x.delta?.marketGap)}</b></div><div class="metric"><small>Δ Competiție RO</small><b>${d(x.delta?.competition)}</b></div><div class="metric"><small>Δ Marjă</small><b>${d(x.delta?.margin)}</b></div><div class="metric"><small>Δ ROI</small><b>${d(x.delta?.roi)}</b></div></div><div class="reason">${(x.reasons||[]).slice(0,3).map(r=>`✓ ${esc(r)}`).join(' · ')||'Încă nu există suficiente motive pozitive validate.'}</div><div class="reason warn">${(x.blockers||[]).slice(0,3).map(r=>`⚠ ${esc(r)}`).join(' · ')||'Fără blocaje majore detectate.'}</div><div class="action"><span>Acțiune recomandată acum</span><strong>${esc(x.action)}</strong></div></article>`).join(''):'<div class="empty">Nu există încă produse suficiente pentru watchlist.</div>';$('#foot').textContent=`Actualizat: ${data.updatedAt?new Date(data.updatedAt).toLocaleString('ro-RO'):'—'} · ${data.policy||''}`}fetch('./watchlist-live.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(new Error('watchlist indisponibil'))).then(render).catch(()=>{$('#grid').innerHTML='<div class="empty">Watchlist-ul nu a fost generat încă. Va apărea după următoarea scanare.</div>'});
</script></body></html>
