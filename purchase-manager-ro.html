<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager achiziții</title><link rel="stylesheet" href="premium-ui.css"></head><body><header><div class="wrap"><h1>Manager achiziții</h1><p>Furnizor → Mostră → Cost total import → Aprobare → Gata de comandă → Comandat</p><nav><a href="index.html">Centru de comandă</a> · <a href="radar-ro.html">Radar</a> · <a href="landed-cost.html">Cost total import</a></nav></div></header><main><section class="kpis"><div class="kpi"><b id="kActive">0</b><small>achiziții active</small></div><div class="kpi"><b id="kSamples">0</b><small>mostre în lucru</small></div><div class="kpi"><b id="kReady">0</b><small>GATA DE COMANDĂ</small></div><div class="kpi"><b id="kOrdered">0</b><small>COMANDATE</small></div><div class="kpi"><b id="kCapital">0 lei</b><small>capital planificat</small></div></section><section class="toolbar"><input id="purchaseSearch" type="search" placeholder="Caută produs sau categorie..."><div class="filters"><button class="filter active" data-filter="ACTIVE">Active</button><button class="filter" data-filter="SAMPLES">Mostre</button><button class="filter" data-filter="READY">Gata</button><button class="filter" data-filter="ORDERED">Comandate</button><button class="filter" data-filter="ALL">Toate</button></div></section><section id="purchaseGrid" class="grid"></section></main><dialog id="purchaseDialog"><form id="purchaseForm" class="dialog"><h2>Gestionare achiziție</h2><p id="pmProduct"></p><p id="pmSupplier"></p><p id="pmLandedInfo"></p><label>Stare<select id="pmStatus"><option value="DE VERIFICAT">DE VERIFICAT</option><option value="SAMPLE COMANDAT">MOSTRĂ COMANDATĂ</option><option value="APROBAT">APROBAT</option><option value="READY TO ORDER">GATA DE COMANDĂ</option><option value="COMANDAT">COMANDAT</option></select></label><label>Cantitate<input id="pmQty" type="number"></label><label>Cost unitar<input id="pmUnit" type="number" step="0.01"></label><label>Nr. comandă<input id="pmOrder"></label><label><input id="pmSampleOrdered" type="checkbox"> Mostră comandată</label><label><input id="pmSampleApproved" type="checkbox"> Mostră aprobată</label><label><input id="pmCompliance" type="checkbox"> Conformitate confirmată</label><label><input id="pmPackaging" type="checkbox"> Ambalare confirmată</label><label><input id="pmLanded" type="checkbox"> Cost import confirmat</label><label><input id="pmPayment" type="checkbox"> Plată confirmată</label><textarea id="pmNotes" rows="3" placeholder="Notițe"></textarea><button id="pmCancel" type="button">Anulează</button><button type="submit">Salvează</button></form></dialog><script type="module" src="purchase-manager.js"></script><script src="purchase-manager-ro.js"></script></body></html>
