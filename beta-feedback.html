<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Feedback Beta · Mega Product Radar</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}header{background:linear-gradient(135deg,#07111f,#17365f);color:#fff;padding:26px 0}h1{margin:0 0 7px;font-size:27px}header p{margin:0;color:#d4deeb;font-size:13px;line-height:1.6}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-size:11px;font-weight:800}input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:11px;font:inherit;background:#fff;color:#101828}textarea{min-height:130px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}button,a{border:0;border-radius:11px;padding:12px 14px;font-weight:900;font-size:11px;text-decoration:none}.primary{background:#175cd3;color:#fff}.secondary{background:#eef4ff;color:#175cd3}.status{font-size:11px;color:#475467;line-height:1.5}.meta{font-size:10px;color:#667085}.notice{background:#fffaeb;border:1px solid #fedf89;border-radius:12px;padding:11px;font-size:10px;color:#7a2e0e;line-height:1.5}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="wrap"><h1>Ajută-ne să facem Radarul mai bun</h1><p>Beta-ul măsoară dacă oportunitățile sunt utile, dacă Romania Gap ajută și dacă produsul justifică un preț real.</p></div></header><main class="wrap"><div class="notice"><b>Important:</b> feedback-ul nu schimbă scoruri, gate-uri, FINALIST, TEST_READY sau BUY_READY și nu autorizează achiziții.</div><section class="card"><div class="meta">Cont: <b id="email">—</b></div><form id="feedbackForm"><div class="grid"><label>Rating general<select id="rating"><option value="5">5 — foarte util</option><option value="4">4 — util</option><option value="3">3 — mediu</option><option value="2">2 — slab</option><option value="1">1 — nu m-a ajutat</option></select></label><label>Zona evaluată<select id="area"><option>OPPORTUNITY</option><option>ROMANIA_GAP</option><option>DISCOVER</option><option>RADAR</option><option>SUPPLIER</option><option>ECONOMICS</option><option>GENERAL</option></select></label><label class="full">Ce a mers / ce te-a blocat?<textarea id="message" required maxlength="3000" placeholder="Ex.: Romania Gap mi-a clarificat concurența, dar supplier evidence este încă insuficient..."></textarea></label><label>Ai plăti 29 € / lună în forma actuală?<select id="wouldPay29"><option value="">Nu știu încă</option><option value="YES">Da</option><option value="NO">Nu</option></select></label><label>Ai plăti în general pentru produs?<select id="wouldPay"><option value="">Nu știu încă</option><option value="YES">Da</option><option value="NO">Nu</option></select></label><label>Ți-a schimbat aplicația o decizie reală?<select id="decisionChanged"><option value="">Nu știu încă</option><option value="YES">Da</option><option value="NO">Nu</option></select></label><label class="full">Ce funcție lipsește?<input id="requestedFeature" maxlength="500" placeholder="Opțional"></label></div><div class="actions"><button id="submit" class="primary" type="submit">Trimite feedback</button><a class="secondary" href="home.html">Înapoi la Home</a><span id="status" class="status"></span></div></form></section></main><script type="module" src="beta-feedback.js"></script></body></html>
