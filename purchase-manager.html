<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Purchase Manager 4.3</title><style>*{box-sizing:border-box}:root{--bg:#f4f7fb;--ink:#101828;--muted:#667085;--line:#e4e7ec;--green:#067647;--amber:#b54708;--blue:#175cd3;--red:#b42318}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}header{background:linear-gradient(135deg,#07111f,#17365f);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 14px 20px}.wrap,main{max-width:1180px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}h1{margin:0;font-size:24px}.tag{font-size:12px;color:#b9c7db;margin-top:5px}.back{color:#fff;text-decoration:none;background:#344054;border-radius:10px;padding:10px 12px;font-size:11px;font-weight:800}main{padding:14px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.kpi,.toolbar,.purchase-card{background:#fff;border:1px solid var(--line);border-radius:15px}.kpi{padding:12px}.kpi b{display:block;font-size:20px}.kpi small,.pc-top small,.pc-metrics small{color:var(--muted);font-size:9px}.toolbar{padding:10px;margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:8px}.toolbar input{min-height:42px;border:1px solid #d0d5dd;border-radius:10px;padding:9px}.filters{display:flex;gap:6px;overflow:auto}.filter{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:8px 10px;font-size:10px;font-weight:800;white-space:nowrap}.filter.active{background:#101828;color:#fff}.grid{display:grid;gap:9px}.purchase-card{padding:13px}.pc-top{display:flex;justify-content:space-between;gap:10px}.pc-top h3{margin:0;font-size:14px}.status{background:#eef4ff;color:#3538cd;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;height:max-content}.status.ready{background:#ecfdf3;color:var(--green)}.status.done{background:#101828;color:#fff}.pc-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.pc-metrics>div,.progress{background:#f8fafc;border-radius:10px;padding:8px}.pc-metrics b{font-size:11px}.progress{margin-top:8px}.progress span,.progress em{display:block;font-size:9px}.progress em{font-style:normal;color:var(--amber);margin-top:4px}.progress em.ok{color:var(--green)}.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.checks span{font-size:9px;background:#f2f4f7;border-radius:999px;padding:5px 7px}.edit{margin-top:9px;border:0;background:#eff4ff;color:var(--blue);border-radius:9px;padding:8px 10px;font-size:10px;font-weight:900}.empty{background:#fff;border:1px solid var(--line);border-radius:15px;padding:24px;text-align:center;color:var(--muted)}dialog{width:min(700px,calc(100% - 24px));border:0;border-radius:18px;padding:0;box-shadow:0 24px 70px #0005}dialog::backdrop{background:#07111faa}.dialog{padding:18px}.dialog h2{margin:0}.dialog p{color:var(--muted);font-size:10px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.formgrid label{font-size:10px;font-weight:800}.formgrid input,.formgrid select,.formgrid textarea{width:100%;min-height:40px;border:1px solid #d0d5dd;border-radius:9px;padding:8px;margin-top:4px;font:inherit}.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px}.check input{width:auto;min-height:auto;margin:0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.actions button{border:0;border-radius:10px;padding:10px 13px;font-weight:900}.save{background:#32d583;color:#052e1d}.cancel{background:#eef2f6;color:#344054}@media(min-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.pc-metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:460px){.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><div class="wrap"><div class="head"><div><h1>Purchase Manager <span style="font-size:10px;background:#344054;border-radius:999px;padding:3px 7px">4.3</span></h1><div class="tag">Supplier → Sample → Aprobare → Ready to Order → Comandat</div></div><a class="back" href="./">← Radar</a></div></div></header><main><section class="kpis"><div class="kpi"><b id="kActive">0</b><small>achiziții active</small></div><div class="kpi"><b id="kSamples">0</b><small>sample în lucru</small></div><div class="kpi"><b id="kReady">0</b><small>READY TO ORDER</small></div><div class="kpi"><b id="kOrdered">0</b><small>COMANDAT</small></div><div class="kpi"><b id="kCapital">0 lei</b><small>capital planificat</small></div></section><section class="toolbar"><input id="purchaseSearch" type="search" placeholder="Caută produs sau categorie..."><div class="filters"><button class="filter active" data-filter="ACTIVE">Active</button><button class="filter" data-filter="SAMPLES">Samples</button><button class="filter" data-filter="READY">Ready</button><button class="filter" data-filter="ORDERED">Comandate</button><button class="filter" data-filter="ALL">Toate</button></div></section><section id="purchaseGrid" class="grid"></section></main><dialog id="purchaseDialog"><form id="purchaseForm" class="dialog"><h2>Gestionare achiziție</h2><p id="pmProduct"></p><p id="pmSupplier"></p><div class="formgrid"><label>Status<select id="pmStatus"><option>DE VERIFICAT</option><option>SAMPLE COMANDAT</option><option>APROBAT</option><option>READY TO ORDER</option><option>COMANDAT</option></select></label><label>Cantitate planificată<input id="pmQty" type="number" min="0" step="1"></label><label>Cost unitar țintă / landed lei<input id="pmUnit" type="number" min="0" step="0.01"></label><label>Nr. comandă / referință<input id="pmOrder"></label><label class="wide check"><input id="pmSampleOrdered" type="checkbox"> Sample comandat</label><label class="wide check"><input id="pmSampleApproved" type="checkbox"> Sample aprobat</label><label class="wide check"><input id="pmCompliance" type="checkbox"> Documente / compliance confirmate</label><label class="wide check"><input id="pmPackaging" type="checkbox"> Ambalare confirmată</label><label class="wide check"><input id="pmLanded" type="checkbox"> Landed cost confirmat</label><label class="wide check"><input id="pmPayment" type="checkbox"> Condiții de plată confirmate</label><label class="wide">Notițe<textarea id="pmNotes" rows="3" placeholder="Termen producție, sample, negociere, documente..."></textarea></label></div><p>Statusul va fi limitat automat la cel mai avansat nivel permis de checklist.</p><div class="actions"><button id="pmCancel" type="button" class="cancel">Anulează</button><button type="submit" class="save">Salvează</button></div></form></dialog><script type="module" src="purchase-manager.js"></script></body></html>
