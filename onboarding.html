<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Onboarding · Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px}header{background:linear-gradient(135deg,#07111f,#17365f);color:#fff;padding:28px 0}h1{margin:5px 0;font-size:30px}header p{color:#cbd5e1;font-size:12px;line-height:1.5}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wide{grid-column:1/-1}label{font-size:11px;font-weight:800;display:block}select,input{width:100%;margin-top:6px;min-height:44px;border:1px solid #d0d5dd;border-radius:10px;padding:10px;background:#fff}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.chip{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:8px 10px;font-size:10px;font-weight:800;cursor:pointer}.chip.active{background:#101828;color:#fff;border-color:#101828}.actions{display:flex;gap:8px;justify-content:flex-end}.actions button,.actions a{border:0;border-radius:11px;padding:12px 15px;font-weight:900;text-decoration:none;font-size:11px}.primary{background:#175cd3;color:#fff}.secondary{background:#eef4ff;color:#175cd3}.status{font-size:10px;color:#667085;min-height:16px;margin-top:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.actions{flex-direction:column}.actions>*{text-align:center}}</style></head><body><header><div class="wrap"><div style="font-size:9px;letter-spacing:.14em;color:#9fb0c8;font-weight:900">PERSONALIZE YOUR RADAR</div><h1>Spune-ne cum vrei să vinzi</h1><p>Aceste răspunsuri personalizează shortlist-ul, bugetul și prioritizarea. Nu schimbă gate-urile de siguranță: fără dovezi suficiente, produsul rămâne HOLD.</p></div></header><main class="wrap"><form id="form" class="card"><div class="grid"><label>Nivelul tău<select id="experience"><option value="BEGINNER">Începător</option><option value="SELLER">Seller activ</option><option value="ADVANCED">Avansat</option></select></label><label>Buget lunar pentru testare (lei)<input id="budget" type="number" min="0" step="100" value="3000"></label><label>Obiectiv<select id="goal"><option value="FIND_PRODUCTS">Vreau produse noi</option><option value="GROW_EXISTING">Vreau să-mi cresc business-ul existent</option><option value="START_BUSINESS">Vreau să pornesc un business</option></select></label><label>Profil de risc<select id="risk"><option value="CONSERVATIVE">Conservator</option><option value="BALANCED">Echilibrat</option><option value="AGGRESSIVE">Mai agresiv</option></select></label><label>Sourcing preferat<select id="sourcing"><option value="CHINA">China</option><option value="EU">UE</option><option value="ANY">Oricare</option></select></label><div><label>Marketplace-uri</label><div class="chips" id="marketplaces"><button type="button" class="chip active" data-value="EMAG_RO">eMAG RO</button><button type="button" class="chip" data-value="TRENDYOL_RO">Trendyol RO</button><button type="button" class="chip" data-value="OWN_SITE">Site propriu</button><button type="button" class="chip" data-value="OTHER">Altele</button></div></div><div class="wide"><label>Categorii de interes</label><div class="chips" id="categories"><button type="button" class="chip" data-value="home">Casă</button><button type="button" class="chip" data-value="auto">Auto</button><button type="button" class="chip" data-value="electronics">Electronice</button><button type="button" class="chip" data-value="beauty">Beauty</button><button type="button" class="chip" data-value="pet">Pet</button><button type="button" class="chip" data-value="sports">Sport</button><button type="button" class="chip" data-value="kids">Copii</button><button type="button" class="chip" data-value="office">Birou</button></div></div></div><div class="status" id="status"></div><div class="actions"><a class="secondary" href="account.html">Mai târziu</a><button class="primary" type="submit">Salvează și personalizează</button></div></form></main><script type="module" src="onboarding.js"></script></body></html>
