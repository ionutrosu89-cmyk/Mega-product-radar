<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Ce fac azi — Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css"><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#22344c;--text:#f5f7fb;--muted:#9db0c9;--good:#35d07f;--warn:#ffbf4b}*{box-sizing:border-box}body{margin:0;background:#07111f;color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}.shell{width:min(920px,100%);margin:auto;padding:16px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#77aefb}.title{font-size:clamp(30px,8vw,46px);line-height:1;margin:6px 0}.sub,.muted{color:var(--muted)}.nav{display:flex;gap:8px;overflow:auto;padding:14px 0}.chip{border:1px solid var(--line);background:#0c1929;padding:9px 12px;border-radius:999px;white-space:nowrap;color:inherit;text-decoration:none}.chip.active{background:#173354}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 18px}.kpi,.task{border:1px solid var(--line);background:var(--panel);border-radius:18px}.kpi{padding:13px}.kpi b{display:block;font-size:25px}.kpi span{font-size:11px;color:var(--muted)}.section{margin:20px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#9fbce6}.tasks{display:grid;gap:10px}.task{padding:14px}.head{display:flex;gap:10px;align-items:flex-start}.num{font-size:24px;font-weight:850;min-width:32px}.grow{flex:1}.name{font-size:17px;font-weight:760}.cat{font-size:12px;color:var(--muted)}.action{margin-top:8px;font-size:14px;font-weight:800;color:var(--warn)}.why{margin-top:7px;font-size:12px;color:#c4d0df}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.badge{border:1px solid var(--line);background:#091727;border-radius:999px;padding:4px 7px;font-size:11px}.good{color:var(--good)}.empty{padding:30px;text-align:center;color:var(--muted)}.foot{font-size:11px;color:#71859f;margin-top:20px}@media(max-width:600px){.summary{grid-template-columns:repeat(3,1fr)}.kpi{padding:10px}.kpi b{font-size:21px}.shell{padding:13px}}
</style></head><body><main class="shell"><div class="eyebrow">Mega Product Radar · Action Center</div><h1 class="title">Ce fac azi?</h1><div class="sub">Maximum 3 acțiuni cu prioritate mare, extrase din Watchlist. Nu schimbă verdictul TEST/CUMPĂRĂ.</div><nav class="nav"><a class="chip" href="radar-ro.html">Radar</a><a class="chip" href="market-intelligence.html">Market Intelligence</a><a class="chip" href="watchlist.html">Top Opportunities</a><a class="chip active" href="action-center.html">Ce fac azi?</a><a class="chip" href="supplier-intelligence.html">Supplier Intelligence</a><a class="chip" href="review-intelligence-v2.html">Review Intelligence V2</a><a class="chip" href="purchase-manager-ro.html">Achiziții</a></nav><section class="summary" id="summary"></section><div class="section">Prioritățile zilei</div><section class="tasks" id="tasks"></section><div class="section">După ce termini</div><section class="tasks" id="later"></section><div class="foot" id="foot"></div></main><script type="module">
import {roProductName,roCategory} from './product-ro.js';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const explain=x=>{if(x.action==='VALIDEAZĂ PREȚUL')return 'Confirmă costul de achiziție și prețul realist de vânzare înainte de orice decizie.';if(x.action==='VALIDEAZĂ COMPETIȚIA RO')return 'Verifică manual concurenții români observați și dacă produsul este deja saturat.';if(x.action==='COMPLETEAZĂ DOVEZILE')return 'Lipsesc dovezi suficiente pentru o decizie comercială responsabilă.';if(x.action==='URMĂREȘTE ACUM')return 'Trendul și scorurile s-au îmbunătățit; merită reverificat înainte să se schimbe piața.';if(x.action==='VERIFICĂ PENTRU TEST')return 'Semnalele sunt suficient de bune pentru verificarea finală, dar TEST rămâne decis doar de regulile stricte.';return 'Păstrează produsul sub observație; nu există încă motiv suficient pentru bani reali.'};
function card(x,i){return `<article class="task"><div class="head"><div class="num">${i+1}</div><div class="grow"><div class="name">${esc(roProductName(x.name))}</div><div class="cat">${esc(roCategory(x.cat))}</div><div class="action">${esc(x.action)}</div></div></div><div class="why">${esc(explain(x))}</div><div class="meta"><span class="badge">Opportunity ${x.opportunityScore}</span><span class="badge">Launch ${x.launchScore}</span><span class="badge">Urgency ${x.urgency}</span><span class="badge ${['ACCELERATING','RISING'].includes(x.trend)?'good':''}">${esc(x.trend)}</span></div></article>`}
function render(d){const all=d.items||[],actionable=all.filter(x=>x.action!=='MONITORIZEAZĂ'&&x.action!=='MAI AȘTEAPTĂ DATE');const today=(actionable.length?actionable:all).slice(0,3),later=all.filter(x=>!today.includes(x)).slice(0,4);$('#summary').innerHTML=`<div class="kpi"><b>${today.length}</b><span>de făcut azi</span></div><div class="kpi"><b>${all.filter(x=>x.changed).length}</b><span>produse schimbate</span></div><div class="kpi"><b>${all.filter(x=>x.urgency>=65).length}</b><span>atenție ridicată</span></div>`;$('#tasks').innerHTML=today.length?today.map(card).join(''):'<div class="empty">Nu există acțiuni prioritare azi.</div>';$('#later').innerHTML=later.length?later.map(card).join(''):'<div class="empty">Nimic suplimentar de urmărit acum.</div>';$('#foot').textContent=`Actualizat din Watchlist: ${d.updatedAt?new Date(d.updatedAt).toLocaleString('ro-RO'):'—'} · Maximum 3 priorități pentru a evita zgomotul.`}
fetch('./watchlist-live.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>{$('#tasks').innerHTML='<div class="empty">Action Center va apărea după generarea Watchlist-ului.</div>'});
</script></body></html>
