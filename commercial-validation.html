<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Validare comercială — Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css"><style>body{margin:0;background:#07111f;color:#f5f7fb;font:14px/1.45 system-ui;padding:env(safe-area-inset-top) 0 80px}.shell{max-width:1040px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #22344c;background:#0d1b2d;border-radius:16px;padding:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px;background:#091727;border-radius:9px;margin:6px 0}.ok{color:#35d07f}.warn{color:#ffbf4b}.bad{color:#ff7474}.muted{color:#9db0c9}.bar{height:8px;background:#091727;border-radius:99px;overflow:hidden}.fill{height:100%;background:#35d07f}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0}.nav a{border:1px solid #22344c;border-radius:999px;padding:8px 10px;color:inherit;text-decoration:none;white-space:nowrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="muted">Mega Product Radar · Commercial Hardening</div><h1>Validare comercială</h1><p class="muted">Aici vezi exact ce lipsește pentru ca un produs să poată ajunge la TEST. Proxy-urile nu sunt considerate dovezi verificate.</p><nav class="nav"><a href="action-center.html">Ce fac azi?</a><a href="product-decision.html">Dosar produs</a><a href="supplier-intelligence.html">Furnizori</a><a href="review-intelligence-v2.html">Review-uri</a><a href="landed-cost.html">Landed cost</a></nav><section id="summary" class="grid"></section><h2>Produse</h2><section id="items" class="grid"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cls=s=>String(s).includes('VERIFIED')||s==='EVIDENCE_READY'||s==='COMMERCIAL_VERIFIED'?'ok':s==='MISSING'?'bad':'warn';fetch('./commercial-hardening-live.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const s=d.stats||{};summary.innerHTML=`<div class="card"><b>${s.pricingVerified||0}</b><div class="muted">pricing RO verificat</div></div><div class="card"><b>${s.salesVerified||0}</b><div class="muted">sales/velocity verificat</div></div><div class="card"><b>${s.supplierVerified||0}</b><div class="muted">furnizori verificați</div></div><div class="card"><b>${s.reviewVerified||0}</b><div class="muted">review evidence</div></div>`;items.innerHTML=(d.items||[]).map(x=>`<article class="card"><b>${esc(x.name)}</b><div class="muted">${esc(x.cat||'')} · ${esc(x.goldenStage||'')}</div><div class="row"><span>Readiness comercial</span><b>${x.readiness||0}%</b></div><div class="bar"><div class="fill" style="width:${x.readiness||0}%"></div></div><div class="row"><span>Pricing România</span><b class="${cls(x.pricingStatus)}">${esc(x.pricingStatus)}</b></div><div class="row"><span>Sales/velocity</span><b class="${cls(x.salesStatus)}">${esc(x.salesStatus)}</b></div><div class="row"><span>Supplier</span><b class="${cls(x.supplierStatus)}">${esc(x.supplierStatus)}</b></div><div class="row"><span>Reviews</span><b class="${cls(x.reviewStatus)}">${esc(x.reviewStatus)}</b></div><div class="row"><span>Feedback real</span><b>${esc(x.feedbackStatus)}</b></div></article>`).join('')||'<div class="card">Datele vor apărea după prima rulare a noului pipeline.</div>'}).catch(()=>items.innerHTML='<div class="card">Commercial hardening nu a rulat încă.</div>');</script></body></html>
