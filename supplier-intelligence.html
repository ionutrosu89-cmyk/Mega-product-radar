<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Supplier Intelligence 6.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom))}header{background:#07111f;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 14px 20px}.wrap,main{max-width:1100px;margin:auto}h1{margin:0;font-size:23px}.tag{font-size:10px;color:#b9c7db;margin-top:5px}main{padding:14px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}label{font-size:9px;font-weight:800}input,select{width:100%;min-height:40px;border:1px solid #d0d5dd;border-radius:9px;padding:8px;margin-top:4px}.btn{border:0;border-radius:10px;padding:10px 12px;background:#101828;color:#fff;font-weight:900}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid #eaecf0}.good{color:#067647}.bad{color:#b42318}.note{font-size:10px;color:#667085;line-height:1.45}.nav{color:#fff;text-decoration:none;display:inline-block;margin-top:10px;font-size:10px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:440px){main{padding:10px}.grid{grid-template-columns:1fr}.table{font-size:9px}}</style></head><body><header><div class="wrap"><h1>Supplier Intelligence <small>6.0</small></h1><div class="tag">Compară 3–5 furnizori după risc, preț, MOQ și readiness comercial.</div><a class="nav" href="index.html">← Command Center</a></div></header><main><section class="panel"><h2>Adaugă ofertă furnizor</h2><div class="grid"><label>Produs<input id="product"></label><label>Furnizor<input id="name"></label><label>Platformă<select id="platform"><option>Alibaba</option><option>1688</option><option>Altă sursă</option></select></label><label>URL<input id="url"></label><label>Preț / buc lei<input id="price" type="number" step="0.01"></label><label>MOQ<input id="moq" type="number"></label><label>Rating<input id="rating" type="number" step="0.1" max="5"></label><label>Ani activitate<input id="years" type="number"></label><label>Sample cost<input id="sample" type="number" step="0.01"></label><label>Trade Assurance<select id="ta"><option value="true">Da</option><option value="false">Nu</option></select></label><label>Certificări<input id="cert" placeholder="CE, RoHS..."></label><div><button id="save" class="btn" style="margin-top:16px">Salvează ofertă</button></div></div></section><section class="panel"><div class="grid"><label>Filtru produs<input id="filter"></label><label>Cantitate țintă<input id="qty" type="number" value="100"></label><label>Cost țintă / buc<input id="target" type="number" value="50" step="0.01"></label><div><button id="rank" class="btn" style="margin-top:16px">Compară</button></div></div><p class="note">Scorul V6 este o evaluare internă. Ratingul, vechimea, certificările și Trade Assurance trebuie introduse numai după verificare reală.</p><div id="results"></div></section></main><script type="module" src="supplier-intelligence.js"></script></body></html>
