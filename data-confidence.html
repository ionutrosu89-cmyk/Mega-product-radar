<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Data Confidence — Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css"><style>body{margin:0;background:#07111f;color:#f5f7fb;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}.shell{max-width:1040px;margin:auto;padding:18px}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0 18px}.chip,.card,.kpi{border:1px solid #22344c;background:#0d1b2d;border-radius:16px}.chip{padding:9px 12px;color:inherit;text-decoration:none;white-space:nowrap}.muted{color:#9db0c9}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.kpi{padding:14px}.kpi b{display:block;font-size:24px}.dims{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:14px 0}.dim{background:#091727;border:1px solid #22344c;border-radius:12px;padding:10px}.dim b{display:block;font-size:18px}.grid{display:grid;gap:9px}.card{padding:12px}.row{display:flex;justify-content:space-between;gap:10px}.good{color:#35d07f}.warn{color:#ffbf4b}.bad{color:#ff7a7a}@media(max-width:800px){.dims{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.kpis{grid-template-columns:1fr}.shell{padding:14px}}</style></head><body><main class="shell"><div class="muted">Mega Product Radar · gratuit</div><h1>Data Confidence Dashboard</h1><div class="muted">Măsoară cât de complete sunt dovezile. Nu este probabilitate de succes.</div><nav class="nav"><a class="chip" href="alerts.html">Alerte</a><a class="chip" href="validation-queue.html">Validation Queue</a><a class="chip" href="watchlist.html">Top Opportunities</a><a class="chip" href="market-intelligence.html">Market Intelligence</a></nav><section class="kpis"><div class="kpi"><b id="high">—</b><span class="muted">încredere ridicată</span></div><div class="kpi"><b id="medium">—</b><span class="muted">încredere medie</span></div><div class="kpi"><b id="low">—</b><span class="muted">încredere scăzută</span></div></section><section id="dims" class="dims"></section><section id="grid" class="grid"></section></main><script type="module">import{roProductName}from'./product-ro.js';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const labels={market:'Piață',demand:'Cerere',competition:'Competiție',reviews:'Review-uri',sourcing:'Sourcing',pricing:'Pricing',history:'Istoric'};fetch('./data-confidence-live.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{high.textContent=d.stats?.levels?.['RIDICATĂ']??0;medium.textContent=d.stats?.levels?.['MEDIE']??0;low.textContent=d.stats?.levels?.['SCĂZUTĂ']??0;dims.innerHTML=Object.entries(d.dimensionAverages||{}).map(([k,v])=>`<div class="dim"><span class="muted">${labels[k]||k}</span><b>${v}</b><small class="muted">lipsă la ${d.missingCounts?.[k]??0} produse</small></div>`).join('');grid.innerHTML=(d.products||[]).slice(0,50).map(x=>`<article class="card"><div class="row"><b>#${x.rank||'—'} · ${esc(roProductName(x.name))}</b><b class="${x.level==='RIDICATĂ'?'good':x.level==='MEDIE'?'warn':'bad'}">${x.score} · ${esc(x.level)}</b></div><div class="muted">Lipsuri: ${x.missing?.length?esc(x.missing.map(k=>labels[k]||k).join(' · ')):'niciun deficit major detectat'}</div></article>`).join('');}).catch(()=>grid.innerHTML='<div class="card">Dashboardul nu are încă date.</div>');</script></body></html>
