<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Golden Pipeline — Mega Product Radar</title><link rel="stylesheet" href="premium-ui.css"><style>body{margin:0;background:#07111f;color:#f5f7fb;font:14px/1.45 system-ui;padding:env(safe-area-inset-top) 0 80px}.shell{max-width:1040px;margin:auto;padding:16px}.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.k,.card{border:1px solid #22344c;background:#0d1b2d;border-radius:16px;padding:13px}.k b{font-size:25px;display:block}.muted{color:#9db0c9}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:9px;margin-top:7px}.badge{border:1px solid #2b405b;border-radius:999px;padding:3px 7px;font-size:11px}.FINALIST,.TEST_READY{color:#35d07f}.VALIDATE{color:#ffbf4b}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0}.nav a{border:1px solid #22344c;border-radius:999px;padding:8px 10px;color:inherit;text-decoration:none;white-space:nowrap}@media(max-width:760px){.funnel{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="muted">Mega Product Radar · Golden Product Pipeline</div><h1>Golden Product Pipeline</h1><p class="muted">Nu mai cheltuim aceeași energie și aceiași bani pe toate produsele. Doar supraviețuitorii avansează spre date plătite și validare profundă.</p><nav class="nav"><a href="action-center.html">Ce fac azi?</a><a href="market-intelligence.html">Market Intelligence</a><a href="commercial-validation.html">Validare comercială</a><a href="product-decision.html">Dosar produs</a></nav><section id="funnel" class="funnel"></section><section id="items" class="grid"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('./golden-pipeline-live.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const s=d.stats||{};funnel.innerHTML=`<div class="k"><b>${s.total||0}</b><span class="muted">Total</span></div><div class="k"><b>${s.promising||0}</b><span class="muted">Top 15 · Promising</span></div><div class="k"><b>${s.validate||0}</b><span class="muted">Top 5 · Validate</span></div><div class="k"><b>${s.finalists||0}</b><span class="muted">Top 3 · Finalists</span></div><div class="k"><b>${s.testReady||0}</b><span class="muted">TEST READY</span></div>`;items.innerHTML=(d.items||[]).slice(0,30).map(x=>`<article class="card"><div class="row"><b>#${x.rank} · ${esc(x.name)}</b><span class="badge ${esc(x.stage)}">${esc(x.stage)}</span></div><div class="muted">${esc(x.cat||'')}</div><div class="row"><span>Golden score</span><b>${x.score||0}</b></div><div class="row"><span>Keyword RO verificat</span><b>${x.keywordVerified?'DA':'NU'}</b></div><div class="row"><span>Confidence</span><b>${x.confidence||0}</b></div><div class="row"><span>Date plătite</span><b>${x.paidDataEligible?'ELIGIBIL':'NU'}</b></div>${(x.blockers||[]).length?`<div class="muted" style="margin-top:8px">Blocaje: ${esc(x.blockers.join(' · '))}</div>`:''}</article>`).join('')}).catch(()=>items.innerHTML='<div class="card">Pipeline-ul va apărea după prima rulare.</div>');</script></body></html>
